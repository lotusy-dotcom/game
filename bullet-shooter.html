<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>별빛 팡팡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2457; --card:rgba(255,255,255,.55); --accent:#ff6b9d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Jua',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,#ffd6e8,#e6d6ff,#d6e4ff,#d4f5e9,#ffd6e8);
    background-size:400% 400%;animation:bgmove 18s ease infinite;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  @keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bubble{position:absolute;bottom:-160px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 60%,transparent 70%);
    animation:rise linear infinite;opacity:.7}
  @keyframes rise{0%{transform:translateY(0) translateX(0) scale(.8)}50%{transform:translateY(-60vh) translateX(40px) scale(1)}100%{transform:translateY(-125vh) translateX(-30px) scale(1.1)}}

  #app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 16px}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:6px;width:min(max(var(--gw),330px),calc(100vw - 20px))}
  .scaler{transform:scale(var(--k,1));transform-origin:center}
  @media (max-width:380px){ #app{padding:6px 10px} .pill{min-width:64px;padding:4px 8px} .pill b{font-size:20px} .title{font-size:23px} .menu{padding:6px 8px;font-size:13px} .btn{width:34px;height:34px;font-size:16px} .bombBtn{padding:5px 10px} #lives{font-size:14px;padding:5px 7px} }
  @media (max-width:330px){ .hint{display:none} }
  .pill{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:2px solid rgba(255,255,255,.8);border-radius:20px;padding:5px 12px;
    box-shadow:0 6px 20px rgba(120,80,160,.15);display:flex;flex-direction:column;align-items:center;min-width:76px}
  .pill small{font-size:12px;opacity:.65;letter-spacing:1px}
  .pill b{font-size:24px;font-weight:400;line-height:1.1;display:inline-block}
  #score.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-4deg);color:#ff3d7f}100%{transform:scale(1)}}
  .title{font-size:27px;letter-spacing:1px;text-align:center;line-height:1;white-space:nowrap;
    text-shadow:0 3px 0 #fff,0 0 12px rgba(255,255,255,.9)}
  .title span{display:inline-block;animation:wave 1.6s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .hint{font-size:12px;opacity:.6;text-align:center;white-space:nowrap}

  .frame{position:relative;border-radius:22px;padding:5px;
    background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.3));
    border:3px solid rgba(255,255,255,.9);
    box-shadow:0 20px 50px rgba(90,50,150,.3), inset 0 0 30px rgba(255,255,255,.5)}
  #game{display:block;border-radius:16px;touch-action:none;cursor:crosshair}

  .row{display:flex;gap:6px;align-items:center}
  .btn{font-family:inherit;border:none;cursor:pointer;border-radius:50%;width:38px;height:38px;font-size:18px;flex:0 0 auto;
    background:var(--card);border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(120,80,160,.15);transition:transform .15s;color:var(--ink)}
  .btn:hover{transform:scale(1.1) rotate(-6deg)}
  .menu{font-family:inherit;text-decoration:none;color:var(--ink);font-size:15px;white-space:nowrap;
    background:var(--card);border:2px solid rgba(255,255,255,.9);border-radius:999px;padding:7px 11px;
    box-shadow:0 4px 12px rgba(120,80,160,.15);transition:transform .15s}
  .menu:hover{transform:scale(1.06)}
  #lives{flex-direction:row;gap:1px;padding:6px 10px;min-width:0;font-size:16px;color:#ff4f86;letter-spacing:-1px;line-height:1.2;min-height:38px;justify-content:center}
  #lives .empty{color:rgba(120,80,160,.25)}
  .bombBtn{font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:16px;color:#fff;white-space:nowrap;
    padding:6px 13px;border-radius:999px;border:2px solid rgba(255,255,255,.9);
    background:linear-gradient(90deg,#7b5cff,#ff5ca8);box-shadow:0 4px 0 #5a3fc4,0 6px 14px rgba(123,92,255,.35);transition:transform .1s}
  .bombBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a3fc4}
  .bombBtn.empty{filter:grayscale(.8);opacity:.6}
  .bombBtn b{font-weight:400;font-size:19px}

  .overlay{position:absolute;inset:5px;display:none;align-items:center;justify-content:center;z-index:5;
    background:rgba(20,10,50,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:16px}
  .overlay.show{display:flex;animation:fadein .4s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .panel{background:linear-gradient(180deg,#fff,#f6f0ff);border-radius:28px;padding:22px 22px;text-align:center;width:310px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);border:4px solid #d9c2ff;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0)}}
  .panel h2{font-size:38px;font-weight:400;color:#ff4f86;animation:wobble 2s ease-in-out infinite}
  .panel h2.t span{display:inline-block;animation:wave 1.6s ease-in-out infinite}
  @keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .panel .big{font-size:52px;margin:4px 0;color:#7b5cff}
  .panel p{opacity:.75;margin-bottom:4px;font-size:15px}
  .panel .rec{color:#fff;background:linear-gradient(90deg,#ff5c8a,#a66bff);border-radius:12px;padding:3px 12px;display:inline-block;margin:6px 0;animation:bump .8s ease infinite}
  .panel ul{list-style:none;font-size:14px;opacity:.75;line-height:1.7;margin:10px 0 4px}
  .tap{margin-top:12px;font-size:26px;color:#7b5cff;animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.94)}}
  .retry{margin-top:14px;font-family:inherit;font-size:24px;border:none;cursor:pointer;color:#fff;
    padding:12px 36px;border-radius:999px;background:linear-gradient(90deg,#7b5cff,#ff5ca8);
    box-shadow:0 6px 0 #5a3fc4,0 10px 20px rgba(123,92,255,.4);transition:transform .1s}
  .retry:hover{transform:translateY(-2px) scale(1.05)}
  .retry:active{transform:translateY(4px);box-shadow:0 2px 0 #5a3fc4}
  #start{cursor:pointer}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div id="app">
  <div class="hud">
    <div class="pill"><small>SCORE</small><b id="score">0</b></div>
    <div>
      <div class="title" id="title"></div>
      <div class="hint">드래그 · 방향키로 이동</div>
    </div>
    <div class="pill"><small>BEST</small><b id="best">0</b></div>
  </div>
  <div class="frame" id="frame">
    <canvas id="game"></canvas>
    <div class="overlay show" id="start">
      <div class="scaler"><div class="panel">
        <h2 class="t" id="startTitle"></h2>
        <p>별콩호를 타고 우주 말썽쟁이들을 물리쳐요!</p>
        <ul>
          <li>드래그 / 방향키·WASD : 이동 (자동 발사)</li>
          <li>Shift : 정밀 이동 · B / 💣 : 폭탄</li>
          <li>P / Esc : 일시정지</li>
          <li>반짝이는 <b style="color:#ff4f86;font-weight:400">중심점</b>만 피하면 OK!</li>
        </ul>
        <div class="tap">탭하여 시작</div>
      </div></div>
    </div>
    <div class="overlay" id="pause">
      <div class="scaler"><div class="panel">
        <h2>일시정지</h2>
        <p>P / Esc 로 계속</p>
        <button class="retry" id="resume">계속하기</button>
      </div></div>
    </div>
    <div class="overlay" id="over">
      <div class="scaler"><div class="panel">
        <h2>게임 오버!</h2>
        <p>최종 점수</p>
        <div class="big" id="finalScore">0</div>
        <div id="newRec" class="rec" style="display:none">🎉 최고 기록 갱신!</div>
        <p>도달 웨이브 <span id="finalWave">1</span> · 최고 기록 <span id="bestScore">0</span></p>
        <button class="retry" id="retry">다시 하기</button>
      </div></div>
    </div>
  </div>
  <div class="hud">
    <a class="menu" href="index.html">← 메뉴</a>
    <div class="pill" id="lives"></div>
    <div class="row">
      <button class="bombBtn" id="bombBtn" title="폭탄 (B)">💣<b id="bombs">3</b></button>
      <button class="btn" id="pauseBtn" title="일시정지">⏸</button>
      <button class="btn" id="mute" title="소리">🔊</button>
    </div>
  </div>
</div>

<script>
(() => {
const TAU = Math.PI * 2;
const W = 440, H = 680;
const MAX_EB = 650, MAX_PB = 160, MAX_P = 550, MAX_TX = 50;

// ---------- DOM / canvas ----------
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
const livesEl = document.getElementById('lives'), bombsEl = document.getElementById('bombs'), bombBtn = document.getElementById('bombBtn');
const startEl = document.getElementById('start'), pauseEl = document.getElementById('pause'), overEl = document.getElementById('over');
let scale = 1, dpr = 1;

const COLORS = ['#ff5c8a','#ffa62b','#4cc38a','#5b8cff','#b05cff'];
function wavyTitle(text){ return [...text].map((c,i)=>`<span style="animation-delay:${i*0.12}s;color:${COLORS[i%5]}">${c===' '?'&nbsp;':c}</span>`).join(''); }
document.getElementById('title').innerHTML = wavyTitle('별빛 팡팡');
document.getElementById('startTitle').innerHTML = wavyTitle('별빛 팡팡');

const bubWrap = document.getElementById('bubbles');
for (let i=0;i<12;i++){
  const b=document.createElement('div'); b.className='bubble';
  const s=20+Math.random()*90;
  Object.assign(b.style,{width:s+'px',height:s+'px',left:Math.random()*100+'%',
    animationDuration:(10+Math.random()*14)+'s',animationDelay:(-Math.random()*20)+'s'});
  bubWrap.appendChild(b);
}

function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  const availH = window.innerHeight - 150, availW = window.innerWidth - (window.innerWidth <= 380 ? 36 : 48);
  scale = Math.max(0.35, Math.min(availW / W, availH / H, 1.3));
  cv.style.width = W*scale+'px'; cv.style.height = H*scale+'px';
  cv.width = Math.round(W*scale*dpr); cv.height = Math.round(H*scale*dpr);
  document.documentElement.style.setProperty('--gw', (W*scale+16)+'px');
  document.documentElement.style.setProperty('--k', Math.min(1, scale/0.82).toFixed(3));
}
window.addEventListener('resize', resize); resize();

// ---------- storage ----------
let best = 0;
try { best = +localStorage.getItem('shooter_best') || 0; } catch(e){}
bestEl.textContent = best;

// ---------- audio ----------
let actx = null, muted = false, noiseBuf = null;
function audioInit(){
  if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, dur, type='sine', vol=.15, f2=null, delay=0){
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+dur+0.03);
}
function noise(dur, vol=.2, freq=1500, freqEnd=null, delay=0){
  if (!actx || muted) return;
  if (!noiseBuf){
    noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate*1.5), actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  const t0 = actx.currentTime + delay;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(freq, t0);
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t0+dur);
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  s.connect(f).connect(g).connect(actx.destination); s.start(t0); s.stop(t0+dur+0.05);
}
const thr = {};
function throttle(k, ms){ const n = performance.now(); if (thr[k] && n - thr[k] < ms) return false; thr[k] = n; return true; }
const sfx = {
  shoot(){ if (throttle('shoot',110)) tone(1300,.05,'square',.014,700); },
  hit(){ if (throttle('hit',55)) tone(320+Math.random()*80,.05,'square',.035,160); },
  ting(){ if (throttle('ting',90)) tone(2200,.06,'triangle',.03,1800); },
  eshot(){ if (throttle('eshot',120)) tone(500,.08,'triangle',.03,260); },
  explode(big){
    if (!throttle('exp',45)) return;
    noise(big?.6:.28, big?.3:.16, big?1600:2400, 80);
    tone(big?160:220,big?.5:.22,'sawtooth',big?.09:.05,40);
  },
  power(){ [0,4,7,12].forEach((k,i)=>tone(660*Math.pow(2,k/12),.12,'triangle',.1,null,i*.05)); },
  heart(){ [0,4,7,12,16].forEach((k,i)=>tone(523*Math.pow(2,k/12),.18,'sine',.12,null,i*.06)); },
  bomb(){ noise(1.1,.35,3000,60); tone(90,1,'sawtooth',.12,30); tone(1200,.5,'sine',.06,200); },
  siren(){ for (let i=0;i<3;i++){ tone(520,.36,'sawtooth',.06,980,i*.76); tone(980,.36,'sawtooth',.06,520,i*.76+.38); } },
  phase(){ tone(200,.6,'sawtooth',.08,900); noise(.5,.2,2000,200); },
  playerHit(){ tone(500,.4,'square',.1,70); noise(.5,.28,2000,100); },
  graze(){ if (throttle('graze',60)) tone(2600,.03,'sine',.025); },
  wave(){ tone(660,.1,'triangle',.1); tone(990,.16,'triangle',.1,null,.1); },
  bossDie(){ noise(1.6,.4,2500,50); tone(300,1.4,'sawtooth',.1,30); [0,4,7,12,16,19].forEach((k,i)=>tone(523*Math.pow(2,k/12),.25,'triangle',.08,null,.9+i*.08)); },
  over(){ tone(500,.25,'triangle',.12,350); tone(350,.3,'triangle',.12,250,.25); tone(250,.6,'sawtooth',.08,90,.55); },
};
document.getElementById('mute').onclick = e => { muted = !muted; e.currentTarget.textContent = muted?'🔇':'🔊'; e.currentTarget.blur(); };

// ---------- helpers ----------
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rand(a,b){ return a + Math.random()*(b-a); }
function easeOutBack(k){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2); }
function easeOutCubic(k){ return 1-Math.pow(1-k,3); }
function angDiff(a,b){ let d = (a-b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function hexA(h,a){ const n=parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function star(c, x, y, s, rot, pts=5, inner=.45){
  c.save(); c.translate(x,y); c.rotate(rot); c.beginPath();
  for (let i=0;i<pts*2;i++){ const r = i%2? s*inner : s; const a = i*Math.PI/pts - Math.PI/2; c.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  c.closePath(); c.fill(); c.restore();
}

// ---------- sprites (pre-rendered glow) ----------
const glowCache = {}, softCache = {};
function glowSprite(color){
  if (glowCache[color]) return glowCache[color];
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'#ffffff'); gr.addColorStop(.26,'#ffffff'); gr.addColorStop(.42,color);
  gr.addColorStop(.6,hexA(color,.35)); gr.addColorStop(1,hexA(color,0));
  g.fillStyle = gr; g.fillRect(0,0,s,s);
  return glowCache[color] = c;
}
function softSprite(color){
  if (softCache[color]) return softCache[color];
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,hexA(color,.7)); gr.addColorStop(.4,hexA(color,.25)); gr.addColorStop(1,hexA(color,0));
  g.fillStyle = gr; g.fillRect(0,0,s,s);
  return softCache[color] = c;
}
const nebulaSprites = [[280,320],[200,250],[320,180]].map(([h1,h2])=>{
  const s = 320, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  for (let i=0;i<7;i++){
    const x = rand(90,230), y = rand(90,230), r = rand(50,120), h = i%2?h1:h2;
    const gr = g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`hsla(${h},90%,65%,.22)`); gr.addColorStop(1,`hsla(${h},90%,60%,0)`);
    g.fillStyle = gr; g.fillRect(0,0,s,s);
  }
  return c;
});

// ---------- background ----------
const starLayers = [
  {n:70, sp:14, size:1.1, a:.45},
  {n:40, sp:42, size:1.7, a:.7},
  {n:16, sp:150, size:2.2, a:.9, streak:true},
].map(L => ({...L, stars: Array.from({length:L.n}, ()=>({x:Math.random()*W, y:Math.random()*H, tw:Math.random()*TAU, hue:Math.random()<.3?(Math.random()<.5?'#ffd6f0':'#c9e8ff'):'#ffffff'}))}));
let nebulae = [{x:W*.3, y:H*.3, s:1.4, sp:10, i:0, rot:0}], nebulaT = 6;
let starBoost = 1;
const bgGrad = ctx.createLinearGradient(0,0,0,H);
bgGrad.addColorStop(0,'#0b0628'); bgGrad.addColorStop(.55,'#1a0f45'); bgGrad.addColorStop(1,'#2a1258');

// ---------- state ----------
let state = 'title', score, dispScore, best0, player, pBullets, eBullets, enemies, items, particles, rings, texts,
    bombWaves, shake, flash, flashColor, timeScale, slowUntil, waveN, wave, boss, warning, banner, bigPop,
    graze, dieT, keys = {}, drag = null, bombId = 0;
let now = performance.now();

function reset(){
  score = 0; dispScore = 0;
  player = {x:W/2, y:H-90, lx:W/2, tilt:0, inv:0, alive:true, fireT:0, power:1, lives:3, bombs:3, focus:false};
  pBullets = []; eBullets = []; enemies = []; items = []; particles = []; rings = []; texts = []; bombWaves = [];
  shake = 0; flash = 0; flashColor = '255,255,255'; timeScale = 1; slowUntil = 0;
  waveN = 0; wave = null; boss = null; warning = null; banner = null; bigPop = null; graze = 0; dieT = 0;
  scoreEl.textContent = '0';
  updateHud();
}
function updateHud(){
  if (!player) return;
  let h = '';
  for (let i=0;i<5;i++) if (i < player.lives) h += '<span>❤</span>'; else if (i < 3) h += '<span class="empty">❤</span>';
  livesEl.innerHTML = h;
  bombsEl.textContent = player.bombs;
  bombBtn.classList.toggle('empty', player.bombs <= 0);
}
function addScore(p, bump){
  score += p;
  if (bump){ scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
}
function addText(x, y, text, color='#fff', size=18, life=.9){
  if (texts.length >= MAX_TX) texts.shift();
  texts.push({x, y, text, color, size, life, max:life});
}
function addP(p){ if (particles.length < MAX_P) particles.push(p); }

// ---------- flow ----------
function start(){
  audioInit();
  reset();
  state = 'play';
  startEl.classList.remove('show'); overEl.classList.remove('show'); pauseEl.classList.remove('show');
  startWave(1);
}
function pause(){
  if (state !== 'play') return;
  state = 'paused'; pauseEl.classList.add('show'); keys = {}; drag = null;
}
function resume(){
  if (state !== 'paused') return;
  state = 'play'; pauseEl.classList.remove('show'); audioInit();
}
function togglePause(){ if (state==='play') pause(); else if (state==='paused') resume(); }

// ---------- waves ----------
function mulSpd(){ return 1 + Math.min(.55, (waveN-1)*.035); }
function hpMul(){ return 1 + (waveN-1)*.09; }

function startWave(n){
  waveN = n;
  wave = {n, t:0, queue:[], isBoss: n%5===0, bossSpawned:false, clearT:0, cleared:false};
  if (wave.isBoss){
    warning = {t:0};
    sfx.siren();
  } else {
    buildWave(wave);
    banner = {text:`WAVE ${n}`, sub: n===1 ? '별콩호 출격!' : ['조심조심!','힘내요!','반짝반짝 가자!','점점 빨라져요!'][n%4], t:0, color:'#7df9ff'};
    sfx.wave();
  }
}
function buildWave(w){
  const n = w.n;
  let t = 1.2;
  const add = (dt, fn) => w.queue.push({t: t + dt, fn});
  const types = n===1 ? ['divers','sines','divers'] : null;
  const pool = ['divers','sines','divers','sines'];
  if (n>=2) pool.push('chasers','turret');
  if (n>=3) pool.push('vdive','turret');
  if (n>=6) pool.push('chasers','turret2');
  const groups = types || Array.from({length: Math.min(6, 3 + Math.floor(n/3))}, ()=>pool[Math.floor(Math.random()*pool.length)]);
  const gap = Math.max(.6, 1.6 - n*.06);
  for (const g of groups){
    if (g==='divers'){
      const c = 5 + Math.min(5, Math.floor(n/2));
      for (let i=0;i<c;i++){ const x = rand(40, W-40); add(i*.28, ()=>spawnEnemy('diver', x)); }
      t += c*.28 + gap;
    } else if (g==='vdive'){
      const cx = rand(140, W-140);
      for (let i=0;i<7;i++){ const k = i-3; add(Math.abs(k)*.16, ()=>spawnEnemy('diver', cx + k*34)); }
      t += 1 + gap;
    } else if (g==='sines'){
      const c = 6 + Math.min(4, Math.floor(n/3)), bx = rand(110, W-110), ph = Math.random()<.5?0:Math.PI;
      for (let i=0;i<c;i++) add(i*.34, ()=>spawnEnemy('sine', bx, {ph}));
      t += c*.34 + gap;
    } else if (g==='chasers'){
      const c = Math.min(7, 3 + Math.floor(n/3));
      for (let i=0;i<c;i++){ const x = rand(50, W-50); add(i*.5, ()=>spawnEnemy('chaser', x)); }
      t += c*.5 + gap;
    } else if (g==='turret'){
      const pat = ['radial','spiral','aimed'][Math.floor(Math.random()*3)];
      add(0, ()=>spawnEnemy('turret', rand(110, W-110), {pat}));
      t += 3.2 + gap;
    } else if (g==='turret2'){
      const pat = ['radial','spiral','aimed'][Math.floor(Math.random()*3)];
      add(0, ()=>spawnEnemy('turret', W*.27, {pat}));
      add(.4, ()=>spawnEnemy('turret', W*.73, {pat}));
      t += 3.8 + gap;
    }
  }
  w.queue.sort((a,b)=>a.t-b.t);
}

const ENEMY = {
  diver:  {hp:2,  r:14, score:100, color:'#ff6fb5'},
  sine:   {hp:3,  r:15, score:150, color:'#ffd84d'},
  chaser: {hp:4,  r:15, score:200, color:'#b388ff'},
  turret: {hp:26, r:25, score:800, color:'#3ef0c0'},
};
function spawnEnemy(type, x, o={}){
  const D = ENEMY[type];
  const e = {type, x, y:-30, r:D.r, hp:Math.ceil(D.hp*hpMul()), score:D.score, color:D.color, t:0, flash:0, inv:0, ph:Math.random()*10, vx:0, vy:0};
  e.maxHp = e.hp;
  if (type==='diver'){
    e.vy = 210 + Math.min(120, waveN*8);
    const tx = player.alive ? player.x + rand(-80,80) : rand(40,W-40);
    e.vx = clamp((tx - x) / ((H+60)/e.vy), -60, 60);
  } else if (type==='sine'){
    e.bx = x; e.vy = 85 + Math.min(50, waveN*3); e.amp = rand(70, 110); e.freq = 2.2; e.phs = o.ph||0;
    e.fireI = Math.max(1.0, 2.3 - waveN*.08); e.fireT = rand(.4, e.fireI);
  } else if (type==='chaser'){
    e.ang = Math.PI/2; e.sp = 135 + Math.min(80, waveN*5);
  } else if (type==='turret'){
    e.y = -40; e.ty = rand(95, 210); e.stage = 0; e.hold = 5.5 + Math.min(2, waveN*.15); e.pat = o.pat || 'radial'; e.fireT = .5; e.a = Math.random()*TAU;
  }
  enemies.push(e);
  return e;
}

const BOSS_NAMES = ['꾸물 대왕','꾸물 대왕 MK-II','꾸물 황제','꾸물 우주신'];
const BOSS_HUES = [
  ['#c88cff','#7b3fe4','#3d1880'],
  ['#ff9ad5','#e63fa0','#7a1458'],
  ['#8ce8ff','#2fa3e4','#14457a'],
  ['#ffd48c','#e48a2f','#7a3d14'],
];
function spawnBoss(){
  const lv = waveN/5;
  const hp = Math.round(800 + 450*(lv-1));
  boss = {type:'boss', lv, x:W/2, y:-140, r:52, hp, maxHp:hp, score:20000*lv, color:BOSS_HUES[(lv-1)%4][1], pal:BOSS_HUES[(lv-1)%4],
    name: BOSS_NAMES[Math.min(BOSS_NAMES.length-1, lv-1)], t:0, flash:0, inv:99, entering:true, enterT:0, phase:1,
    t1:1, t2:1.5, a:0, b:0, alt:false, dying:0, chainT:0, ph:0};
  enemies.push(boss);
  wave.bossSpawned = true;
}

// ---------- bullets ----------
function eb(x,y,a,sp,color,r=5,o){
  if (eBullets.length >= MAX_EB) return;
  eBullets.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r,color,acc:o&&o.acc||0,curve:o&&o.curve||0,grazed:false});
}
function aimAt(x,y){ return player.alive ? Math.atan2(player.y-y, player.x-x) : Math.PI/2; }
function radial(x,y,n,sp,off,color,r){ for (let i=0;i<n;i++) eb(x,y,off+i*TAU/n,sp,color,r); }
function aimed(x,y,n,spread,sp,color,r){ const a = aimAt(x,y); for (let i=0;i<n;i++) eb(x,y,a+(i-(n-1)/2)*spread,sp,color,r); }
function canShoot(e){ return e.y > 10 && e.y < H*.62 && (!player.alive || Math.hypot(player.x-e.x, player.y-e.y) > 90); }

const SHOTS = [
  null,
  [[-6,0],[6,0]],
  [[-10,0],[0,0],[10,0]],
  [[-10,0],[0,0],[10,0],[-7,-.13],[7,.13]],
  [[-12,0],[-4,0],[4,0],[12,0],[-8,-.15],[8,.15]],
  [[-12,0],[-4,0],[4,0],[12,0],[-8,-.13],[8,.13],[-10,-.28],[10,.28]],
];
function firePlayer(){
  const f = player.focus ? .3 : 1;
  for (const [dx, a] of SHOTS[player.power]){
    if (pBullets.length >= MAX_PB) break;
    const ang = -Math.PI/2 + a*f;
    pBullets.push({x:player.x + dx*(player.focus?.6:1), y:player.y - 18, vx:Math.cos(ang)*920, vy:Math.sin(ang)*920, a:ang});
  }
  sfx.shoot();
}

// ---------- effects ----------
function sparks(x, y, color, n, spd=260, life=.5, size=4){
  for (let i=0;i<n;i++){
    const a = Math.random()*TAU, s = spd*(.3+Math.random()*.7);
    addP({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:life*(.6+Math.random()*.6), max:life, size:size*(.6+Math.random()*.6), color, type:'spark', drag:2.5});
  }
}
function explosion(x, y, color, big=1){
  sparks(x, y, color, Math.round(14*big), 240*Math.sqrt(big), .6, 5);
  sparks(x, y, '#ffffff', Math.round(6*big), 160*Math.sqrt(big), .35, 4);
  for (let i=0;i<Math.round(6*big);i++){
    const a = Math.random()*TAU, s = rand(60, 220)*Math.sqrt(big);
    addP({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(.5,1), max:1, size:rand(3,6), color, type:'debris', rot:Math.random()*TAU, vr:rand(-12,12), drag:1.5});
  }
  for (let i=0;i<Math.round(3*big);i++){
    const a = Math.random()*TAU, s = rand(40,140);
    addP({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:.8, max:.8, size:rand(5,9), color:'#fff59d', type:'star', rot:Math.random()*TAU, vr:rand(-8,8), drag:2});
  }
  rings.push({x, y, r:6, to:40*big+20, life:.45, max:.45, color, w:5+big*2});
  rings.push({x, y, r:2, to:26*big+10, life:.3, max:.3, color:'#ffffff', w:3});
  shake = Math.max(shake, 3 + big*2);
}
function bulletPop(b, pts){
  if (Math.random() < .5) addP({x:b.x, y:b.y, vx:rand(-30,30), vy:rand(-60,-10), life:.4, max:.4, size:b.r*.9, color:b.color, type:'spark', drag:2});
  if (pts) score += pts;
}
function clearBullets(cx, cy, rad, pts=0){
  eBullets = eBullets.filter(b => {
    if (rad < 0 || (b.x-cx)**2 + (b.y-cy)**2 < rad*rad){ bulletPop(b, pts); return false; }
    return true;
  });
}

// ---------- combat ----------
function damage(e, d){
  if (e.dead || e.dying) return;
  if (e.inv > 0){ sfx.ting(); return; }
  e.hp -= d; e.flash = .07;
  sfx.hit();
  if (e.type==='boss'){
    const k = e.hp / e.maxHp;
    if (e.phase===1 && k < .66) bossPhase(e, 2);
    else if (e.phase===2 && k < .33) bossPhase(e, 3);
  }
  if (e.hp <= 0) kill(e);
}
function kill(e){
  if (e.type==='boss'){ startBossDeath(e); return; }
  e.dead = true;
  const big = e.type==='turret' ? 2.4 : 1;
  explosion(e.x, e.y, e.color, big);
  sfx.explode(e.type==='turret');
  const pts = e.score * (1 + Math.floor((waveN-1)/5));
  addScore(pts, e.type==='turret');
  addText(e.x, e.y-10, '+'+pts, e.color, e.type==='turret'?24:17);
  // drops
  const r = Math.random();
  if (e.type==='turret'){
    dropItem(player.power<5 && Math.random()<.65 ? 'P' : (Math.random()<.5?'B':'P'), e.x, e.y);
    if (Math.random()<.18) dropItem('H', e.x+14, e.y);
  } else if (r < .07) dropItem('P', e.x, e.y);
  else if (r < .085) dropItem('B', e.x, e.y);
  else if (r < .095) dropItem('H', e.x, e.y);
}
function dropItem(type, x, y){ items.push({type, x:clamp(x,20,W-20), y, vy:-130, vx:rand(-30,30), t:Math.random()*5}); }

function bossPhase(e, p){
  e.phase = p; e.inv = 1.5; e.t1 = .9; e.t2 = 1.4;
  flash = .9; flashColor = '255,255,255'; shake = Math.max(shake, 18);
  clearBullets(0, 0, -1, 0);
  rings.push({x:e.x, y:e.y, r:30, to:360, life:.8, max:.8, color:e.pal[0], w:14});
  rings.push({x:e.x, y:e.y, r:10, to:240, life:.6, max:.6, color:'#ffffff', w:6});
  sparks(e.x, e.y, e.pal[0], 40, 420, .8, 6);
  banner = {text: p===2 ? '분노 모드!' : '최종 형태!!', sub: p===2 ? '탄막이 소용돌이쳐요' : '마지막 힘을 짜내요', t:0, color: p===2 ? '#ffd84d' : '#ff4d6d'};
  sfx.phase();
}
function startBossDeath(e){
  e.dying = 1.6; e.inv = 99; e.chainT = 0;
  clearBullets(0, 0, -1, 10);
  slowUntil = now + 1700; shake = Math.max(shake, 14);
  sfx.explode(true);
}
function finishBoss(e){
  e.dead = true; boss = null;
  explosion(e.x, e.y, e.pal[0], 6);
  explosion(e.x, e.y, '#ffffff', 3);
  for (let i=0;i<4;i++) rings.push({x:e.x, y:e.y, r:20, to:300 + i*120, life:.7+i*.2, max:.7+i*.2, color:i%2?'#ffffff':e.pal[0], w:16-i*2});
  for (let i=0;i<60;i++){
    const a = Math.random()*TAU, s = rand(200, 700);
    addP({x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(1,1.8), max:1.8, size:rand(4,8), color:`hsl(${Math.random()*360},95%,70%)`, type:'debris', rot:Math.random()*TAU, vr:rand(-14,14), drag:1.2});
  }
  flash = 1; flashColor = '255,255,255'; shake = 34;
  const pts = e.score;
  addScore(pts, true);
  bigPop = {text:'+'+pts, sub:`${e.name} 격파!`, t:0};
  ['P','P','B','H'].forEach((k,i)=>dropItem(k, e.x - 45 + i*30, e.y));
  sfx.bossDie();
}

function hitPlayer(){
  if (player.inv > 0 || !player.alive || state !== 'play') return;
  player.lives--;
  explosion(player.x, player.y, '#7df9ff', 3);
  explosion(player.x, player.y, '#ff6fb5', 1.5);
  sfx.playerHit();
  shake = 22; flash = .65; flashColor = '255,80,120'; slowUntil = now + 380;
  clearBullets(player.x, player.y, 170, 0);
  player.power = Math.max(1, player.power - 1);
  if (player.lives <= 0){
    player.alive = false; state = 'dying'; dieT = 0; slowUntil = now + 1500;
    explosion(player.x, player.y, '#ffd84d', 4);
    setTimeout(()=>sfx.over(), 500);
  } else {
    player.inv = 2.6;
    player.bombs = Math.max(player.bombs, 2);
    addText(player.x, player.y-30, '앗!', '#ff8fb8', 26, 1);
  }
  updateHud();
}

function useBomb(){
  if (state !== 'play' || !player.alive || player.bombs <= 0) return;
  if (bombWaves.length && bombWaves[bombWaves.length-1].r < 300) return;
  audioInit();
  player.bombs--; updateHud();
  bombWaves.push({x:player.x, y:player.y, r:0, id:++bombId});
  player.inv = Math.max(player.inv, 1.8);
  flash = .85; flashColor = '255,255,255'; shake = Math.max(shake, 16);
  sfx.bomb();
  addText(player.x, player.y-40, '별빛 폭탄!', '#ffe36e', 26, 1.1);
}

function collect(it){
  if (it.type==='P'){
    if (player.power < 5){ player.power++; addText(it.x, it.y-14, player.power===5?'MAX POWER!':'POWER UP!', '#ffb14d', 20); }
    else { addScore(1000); addText(it.x, it.y-14, '+1000', '#ffb14d', 18); }
    sfx.power();
  } else if (it.type==='B'){
    if (player.bombs < 6){ player.bombs++; addText(it.x, it.y-14, '폭탄 +1', '#7df9ff', 20); }
    else { addScore(1000); addText(it.x, it.y-14, '+1000', '#7df9ff', 18); }
    sfx.power();
  } else {
    if (player.lives < 5){ player.lives++; addText(it.x, it.y-14, '생명 +1', '#ff6fb5', 20); }
    else { addScore(2000); addText(it.x, it.y-14, '+2000', '#ff6fb5', 18); }
    sfx.heart();
  }
  sparks(it.x, it.y, '#ffffff', 10, 180, .4, 4);
  rings.push({x:it.x, y:it.y, r:6, to:36, life:.35, max:.35, color:'#ffffff', w:4});
  updateHud();
}

// ---------- input ----------
const KEYMAP = {ArrowLeft:'l', a:'l', A:'l', ArrowRight:'r', d:'r', D:'r', ArrowUp:'u', w:'u', W:'u', ArrowDown:'dn', s:'dn', S:'dn'};
window.addEventListener('keydown', e => {
  if (KEYMAP[e.key]){ keys[KEYMAP[e.key]] = true; e.preventDefault(); }
  if (e.key==='Shift') keys.shift = true;
  if (e.key==='b' || e.key==='B'){ useBomb(); }
  if (e.key==='p' || e.key==='P' || e.key==='Escape'){ togglePause(); }
  if (e.key===' ' || e.key==='Enter'){
    e.preventDefault();
    if (state==='title' || state==='over') start();
    else if (state==='paused') resume();
  }
});
window.addEventListener('keyup', e => {
  if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false;
  if (e.key==='Shift') keys.shift = false;
});
window.addEventListener('blur', () => { keys = {}; });
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (state==='title'){ start(); }
  drag = {id:e.pointerId, sx:e.clientX, sy:e.clientY, px:player.x, py:player.y};
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || state !== 'play' || !player.alive) return;
  const r = cv.getBoundingClientRect(), k = W / r.width;
  player.x = clamp(drag.px + (e.clientX - drag.sx)*k*1.15, 14, W-14);
  player.y = clamp(drag.py + (e.clientY - drag.sy)*k*1.15, 24, H-20);
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
startEl.addEventListener('pointerdown', e => { e.preventDefault(); start(); });
document.getElementById('retry').onclick = () => start();
document.getElementById('resume').onclick = () => resume();
document.getElementById('pauseBtn').onclick = e => { togglePause(); e.currentTarget.blur(); };
bombBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); useBomb(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------- update ----------
function update(dt){
  const t = now/1000;
  if (now < slowUntil) timeScale += (.25 - timeScale)*Math.min(1, dt*14);
  else timeScale += (1 - timeScale)*Math.min(1, dt*4);
  const running = state==='play' || state==='dying';
  const gdt = running ? dt*timeScale : (state==='paused' ? 0 : dt);

  // background
  starBoost += ((warning ? 3.5 : 1) - starBoost)*Math.min(1, dt*2);
  for (const L of starLayers) for (const s of L.stars){
    s.y += L.sp*starBoost*gdt;
    if (s.y > H+10){ s.y = -10; s.x = Math.random()*W; }
  }
  nebulaT -= gdt;
  if (nebulaT <= 0){ nebulaT = rand(10, 18); nebulae.push({x:rand(40,W-40), y:-220, s:rand(1,1.7), sp:rand(8,16), i:Math.floor(Math.random()*3), rot:Math.random()*TAU}); }
  for (const n of nebulae) n.y += n.sp*starBoost*gdt;
  nebulae = nebulae.filter(n => n.y < H+260);

  if (state==='title' || state==='paused' || state==='over'){
    if (state!=='paused') updateFx(gdt, dt);
    return;
  }

  // ----- player -----
  if (player.alive){
    player.focus = !!keys.shift;
    const sp = player.focus ? 150 : 300;
    let mx = (keys.r?1:0) - (keys.l?1:0), my = (keys.dn?1:0) - (keys.u?1:0);
    if (mx && my){ mx *= .7071; my *= .7071; }
    player.x = clamp(player.x + mx*sp*dt, 14, W-14);
    player.y = clamp(player.y + my*sp*dt, 24, H-20);
    const vx = (player.x - player.lx) / Math.max(dt, .001);
    player.lx = player.x;
    player.tilt += (clamp(vx/500, -1, 1) - player.tilt)*Math.min(1, dt*10);
    player.inv = Math.max(0, player.inv - gdt);
    player.fireT -= gdt;
    if (player.fireT <= 0 && state==='play'){ player.fireT = .075; firePlayer(); }
  } else {
    dieT += dt;
    if (dieT > 2.1 && state==='dying') showOver();
  }

  // ----- waves -----
  if (wave && state==='play'){
    wave.t += gdt;
    if (wave.isBoss){
      if (!wave.bossSpawned && wave.t >= 2.9){ warning = null; spawnBoss(); }
    } else {
      while (wave.queue.length && wave.queue[0].t <= wave.t) wave.queue.shift().fn();
    }
    const done = wave.isBoss ? (wave.bossSpawned && !boss && !enemies.length) : (!wave.queue.length && !enemies.length);
    if (done){
      if (!wave.cleared){
        wave.cleared = true;
        const bonus = 300 * wave.n;
        addScore(bonus, true);
        addText(W/2, H*.45, `WAVE CLEAR +${bonus}`, '#7dffb0', 24, 1.4);
      }
      wave.clearT += gdt;
      if (wave.clearT > (wave.isBoss ? 3 : 1.6)) startWave(wave.n + 1);
    }
  }
  if (warning) warning.t += dt;

  // ----- enemies -----
  const m = mulSpd();
  for (const e of enemies){
    e.t += gdt; e.flash = Math.max(0, e.flash - gdt);
    if (e.type==='diver'){
      e.x += e.vx*gdt; e.y += e.vy*gdt;
      if (!e.shot && waveN >= 3 && e.y > 150){ e.shot = true; if (canShoot(e)) aimed(e.x, e.y, 1, 0, 170*m, '#4de8ff', 5); }
    } else if (e.type==='sine'){
      e.y += e.vy*gdt; e.x = e.bx + Math.sin(e.t*e.freq + e.phs)*e.amp;
      e.fireT -= gdt;
      if (e.fireT <= 0){ e.fireT = e.fireI; if (canShoot(e)){ aimed(e.x, e.y, waveN>=7?2:1, .18, 160*m, '#4de8ff', 5); sfx.eshot(); } }
    } else if (e.type==='chaser'){
      if (e.t < 2.6 && player.alive){
        const want = Math.atan2(player.y - e.y, player.x - e.x);
        e.ang += clamp(angDiff(want, e.ang), -2.3*gdt, 2.3*gdt);
      }
      e.x += Math.cos(e.ang)*e.sp*gdt; e.y += Math.sin(e.ang)*e.sp*gdt;
    } else if (e.type==='turret'){
      if (e.stage===0){
        e.y += (e.ty - e.y)*Math.min(1, gdt*2.6);
        if (Math.abs(e.ty - e.y) < 4){ e.stage = 1; e.st = 0; }
      } else if (e.stage===1){
        e.st += gdt; e.fireT -= gdt; e.x += Math.sin(e.t*.8)*12*gdt;
        if (e.fireT <= 0 && canShoot(e)){
          if (e.pat==='radial'){ e.fireT = 1.05; radial(e.x, e.y, 12 + Math.min(10, waveN), 125*m, e.a, '#ff5ca8', 6); e.a += .21; sfx.eshot(); }
          else if (e.pat==='spiral'){ e.fireT = .085; eb(e.x, e.y, e.a, 120*m, '#ffd84d', 5); eb(e.x, e.y, e.a+Math.PI, 120*m, '#ffd84d', 5); e.a += .24; }
          else { e.fireT = .75; e.cnt = (e.cnt||0)+1; aimed(e.x, e.y+8, e.cnt%3===0?5:3, .22, 185*m, '#4de8ff', 5); sfx.eshot(); }
        }
        if (e.st > e.hold) e.stage = 2;
      } else {
        e.y -= 110*gdt;
      }
    } else if (e.type==='boss'){
      updateBoss(e, gdt, m);
    }
    if (e.type!=='boss' && e.t > 1 && (e.y > H+50 || e.y < -70 || e.x < -60 || e.x > W+60)) e.gone = true;
  }

  // ----- player bullets -----
  for (const b of pBullets){
    b.x += b.vx*gdt; b.y += b.vy*gdt;
    if (b.y < -30 || b.x < -20 || b.x > W+20){ b.dead = true; continue; }
    for (const e of enemies){
      if (e.dead || e.y < -20) continue;
      const rr = e.r + 5, dx = b.x - e.x, dy = b.y - e.y;
      if (dx*dx + dy*dy < rr*rr){
        b.dead = true; damage(e, 1);
        if (Math.random() < .5) addP({x:b.x, y:b.y, vx:rand(-80,80), vy:rand(-40,60), life:.22, max:.22, size:4, color:'#bff8ff', type:'spark', drag:3});
        break;
      }
    }
  }
  pBullets = pBullets.filter(b => !b.dead);

  // ----- enemy bullets -----
  const pr = player.alive && player.inv <= 0 && state==='play';
  for (const b of eBullets){
    if (b.curve){ const c = Math.cos(b.curve*gdt), s = Math.sin(b.curve*gdt); const vx = b.vx*c - b.vy*s; b.vy = b.vx*s + b.vy*c; b.vx = vx; }
    if (b.acc){ const k = 1 + b.acc*gdt; b.vx *= k; b.vy *= k; }
    b.x += b.vx*gdt; b.y += b.vy*gdt;
    if (b.x < -30 || b.x > W+30 || b.y < -40 || b.y > H+30){ b.dead = true; continue; }
    if (pr){
      const dx = b.x - player.x, dy = b.y - player.y, d2 = dx*dx + dy*dy;
      const hr = b.r*.62 + 2.5;
      if (d2 < hr*hr){ b.dead = true; hitPlayer(); }
      else if (!b.grazed && d2 < (hr+16)*(hr+16)){
        b.grazed = true; graze++; score += 20; sfx.graze();
        addP({x:player.x + dx*.5, y:player.y + dy*.5, vx:dx*3, vy:dy*3, life:.25, max:.25, size:3, color:'#ffffff', type:'spark', drag:3});
      }
    }
  }
  eBullets = eBullets.filter(b => !b.dead);

  // body collisions
  if (player.alive && player.inv <= 0 && state==='play'){
    for (const e of enemies){
      if (e.dead || e.dying || (e.type==='boss' && e.entering)) continue;
      const rr = e.r*.72 + 3;
      if ((e.x-player.x)**2 + (e.y-player.y)**2 < rr*rr){
        hitPlayer();
        if (e.type!=='boss' && e.type!=='turret') damage(e, 99);
        break;
      }
    }
  }

  // ----- bombs -----
  for (const w of bombWaves){
    w.r += 950*gdt;
    clearBullets(w.x, w.y, w.r, 5);
    for (const e of enemies){
      if (e.dead || e.dying || e.bombed === w.id) continue;
      if ((e.x-w.x)**2 + (e.y-w.y)**2 < (w.r + e.r)**2){
        e.bombed = w.id;
        damage(e, e.type==='boss' ? 70 : 40);
      }
    }
  }
  bombWaves = bombWaves.filter(w => w.r < 900);

  enemies = enemies.filter(e => !e.dead && !e.gone);

  // ----- items -----
  for (const it of items){
    it.t += gdt;
    it.vy = Math.min(75, it.vy + 220*gdt);
    it.vx *= (1 - gdt*2);
    it.x += (it.vx + Math.sin(it.t*3)*22)*gdt; it.y += it.vy*gdt;
    if (player.alive){
      const dx = player.x - it.x, dy = player.y - it.y, d = Math.hypot(dx, dy);
      if (d < 80 || player.y < H*.28){ const s = 420*gdt/Math.max(d,1); it.x += dx*Math.min(1,s); it.y += dy*Math.min(1,s); }
      if (d < 26){ it.dead = true; collect(it); }
    }
    if (it.y > H+30) it.dead = true;
  }
  items = items.filter(it => !it.dead);

  updateFx(gdt, dt);
}

function updateBoss(e, gdt, m){
  if (e.entering){
    e.enterT += gdt;
    const k = Math.min(1, e.enterT/2.4);
    e.y = -140 + 280*easeOutBack(k);
    if (k >= 1){ e.entering = false; e.inv = 0; }
    return;
  }
  if (e.dying > 0){
    e.dying -= gdt; e.chainT -= gdt;
    e.x += rand(-1.5,1.5); e.flash = Math.random()<.4 ? .05 : 0;
    if (e.chainT <= 0){
      e.chainT = .11;
      const x = e.x + rand(-65,65), y = e.y + rand(-55,55);
      explosion(x, y, [e.pal[0],'#ffd84d','#ff6fb5','#7df9ff'][Math.floor(Math.random()*4)], 1.4);
      sfx.explode(false);
      shake = Math.max(shake, 9);
    }
    if (e.dying <= 0) finishBoss(e);
    return;
  }
  // movement
  let tx, ty;
  if (e.phase===1){ tx = W/2 + Math.sin(e.t*.7)*70; ty = 140 + Math.sin(e.t*1.3)*8; }
  else if (e.phase===2){ tx = W/2 + Math.sin(e.t*1.0)*90; ty = 135 + Math.sin(e.t*2)*10; }
  else { tx = W/2 + Math.sin(e.t*.9)*120; ty = 150 + Math.sin(e.t*1.8)*30; }
  e.x += (tx - e.x)*Math.min(1, gdt*3); e.y += (ty - e.y)*Math.min(1, gdt*3);
  if (e.inv > 0){ e.inv -= gdt; return; }
  if (!player.alive) return;
  e.t1 -= gdt; e.t2 -= gdt;
  const arms = 3 + Math.min(2, e.lv-1);
  if (e.phase===1){
    if (e.t1 <= 0){ e.t1 = 1.3; e.alt = !e.alt; radial(e.x, e.y+10, 20 + e.lv*2, 135*m, e.alt?0:Math.PI/(20+e.lv*2), '#ff5ca8', 6); sfx.eshot(); }
    if (e.t2 <= 0){ e.t2 = .95; for (const s of [-1,1]) aimed(e.x + s*22, e.y - 4, 3, .2, 210*m, '#4de8ff', 5); }
  } else if (e.phase===2){
    if (e.t1 <= 0){ e.t1 = .08; for (let k=0;k<arms;k++) eb(e.x, e.y+8, e.a + k*TAU/arms, 125*m, '#ffd84d', 5); e.a += .19; }
    if (e.t2 <= 0){ e.t2 = 1.9; aimed(e.x, e.y+24, 3, .38, 165*m, '#ff7af0', 10); sfx.eshot(); }
  } else {
    if (e.t1 <= 0){
      e.t1 = .12;
      for (let k=0;k<arms;k++){ eb(e.x, e.y, e.a + k*TAU/arms, 110*m, '#b98cff', 5); eb(e.x, e.y, e.b + k*TAU/arms, 105*m, '#5cffb0', 5); }
      e.a += .13; e.b -= .17;
    }
    if (e.t2 <= 0){ e.t2 = 1.8; radial(e.x, e.y, 26 + e.lv*2, 170*m, Math.random()*TAU, '#ff4d6d', 6); sfx.eshot(); }
  }
}

function updateFx(gdt, dt){
  for (const p of particles){
    p.life -= gdt; const d = 1 - Math.min(1, gdt*p.drag);
    p.vx *= d; p.vy *= d; p.x += p.vx*gdt; p.y += p.vy*gdt;
    if (p.rot !== undefined) p.rot += p.vr*gdt;
  }
  particles = particles.filter(p => p.life > 0 && p.x > -40 && p.x < W+40 && p.y > -40 && p.y < H+40);
  for (const g of rings) g.life -= gdt; rings = rings.filter(g => g.life > 0);
  for (const t of texts){ t.life -= gdt; t.y -= 40*gdt; } texts = texts.filter(t => t.life > 0);
  shake *= Math.pow(0.002, dt); if (shake < .15) shake = 0;
  flash = Math.max(0, flash - dt*2.4);
  if (banner){ banner.t += dt; if (banner.t > 2) banner = null; }
  if (bigPop){ bigPop.t += dt; if (bigPop.t > 2.4) bigPop = null; }
  if (score !== undefined){
    dispScore += (score - dispScore) * Math.min(1, dt*10);
    if (Math.abs(score-dispScore) < .5) dispScore = score;
    scoreEl.textContent = Math.round(dispScore);
  }
}

function showOver(){
  if (state==='over') return;
  state = 'over';
  const rec = score > best;
  if (rec){ best = score; try { localStorage.setItem('shooter_best', best); } catch(e){} }
  bestEl.textContent = best;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalWave').textContent = waveN;
  document.getElementById('bestScore').textContent = best;
  document.getElementById('newRec').style.display = rec ? 'inline-block' : 'none';
  overEl.classList.add('show');
}

// ---------- drawing: characters ----------
const INK = '#1b1035';
function face(c, s, o={}){
  const ey = o.ey || 0, ex = s*.36, er = s*.15;
  const bl = o.blink === undefined ? 1 : o.blink;
  c.fillStyle = 'rgba(255,110,170,.6)';
  c.beginPath(); c.ellipse(-s*.6, ey+s*.3, s*.15, s*.09, 0, 0, TAU); c.ellipse(s*.6, ey+s*.3, s*.15, s*.09, 0, 0, TAU); c.fill();
  c.fillStyle = INK; c.strokeStyle = INK; c.lineCap = 'round'; c.lineWidth = Math.max(1.3, s*.08);
  const lx = (o.lx||0)*er*.35, ly = (o.ly||0)*er*.35;
  for (const sd of [-1,1]){
    if (o.happy){ c.beginPath(); c.arc(sd*ex, ey+er*.4, er*1.05, Math.PI*1.15, Math.PI*1.85); c.stroke(); continue; }
    c.fillStyle = INK; c.beginPath(); c.ellipse(sd*ex + lx, ey + ly, er, er*1.2*bl, 0, 0, TAU); c.fill();
    if (bl > .5){ c.fillStyle = '#fff'; c.beginPath(); c.arc(sd*ex + lx + er*.35, ey + ly - er*.45, er*.38, 0, TAU); c.fill(); }
    if (o.angry){ c.beginPath(); c.moveTo(sd*(ex+er*1.3), ey - er*2.1); c.lineTo(sd*(ex-er*1.1), ey - er*1.3); c.stroke(); }
  }
  c.fillStyle = INK;
  const my = ey + s*.32;
  if (o.mouth==='o'){ c.beginPath(); c.ellipse(0, my, s*.09, s*.11, 0, 0, TAU); c.fill(); }
  else if (o.mouth==='grr'){ c.beginPath(); c.moveTo(-s*.15, my); c.lineTo(-s*.05, my-s*.06); c.lineTo(s*.05, my); c.lineTo(s*.15, my-s*.06); c.stroke(); }
  else if (o.mouth==='open'){ c.fillStyle = '#c0304a'; c.beginPath(); c.arc(0, my-s*.02, s*.14, 0, Math.PI); c.fill(); }
  else { c.beginPath(); c.arc(0, my - s*.06, s*.1, .15*Math.PI, .85*Math.PI); c.stroke(); }
}
function blinkOf(e, t){ return ((t + e.ph) % 3.3) < .12 ? .15 : 1; }
function lookOf(e){ if (!player.alive) return [0,1]; const a = Math.atan2(player.y-e.y, player.x-e.x); return [Math.cos(a), Math.sin(a)]; }

function drawEnemy(c, e, t){
  const fl = e.flash > 0;
  c.save(); c.translate(e.x, e.y);
  // neon aura
  c.globalCompositeOperation = 'lighter';
  const ar = e.r * (e.type==='boss' ? 3.4 : 3);
  c.globalAlpha = e.type==='boss' ? .7 : .55;
  c.drawImage(softSprite(e.color), -ar, -ar, ar*2, ar*2);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  const r = e.r;
  const [lx, ly] = lookOf(e);
  if (e.type==='diver'){
    const sq = 1 + Math.sin(t*10 + e.ph)*.06;
    c.scale(1/sq, sq);
    const g = c.createLinearGradient(0, -r*1.3, 0, r);
    g.addColorStop(0, '#ffd1ea'); g.addColorStop(1, '#ff4fa0');
    c.fillStyle = fl ? '#fff' : g;
    c.beginPath(); c.moveTo(0, -r*1.35);
    c.bezierCurveTo(r*.9, -r*.35, r*1.08, r*.95, 0, r*.98);
    c.bezierCurveTo(-r*1.08, r*.95, -r*.9, -r*.35, 0, -r*1.35); c.fill();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-r*.35, -r*.2, r*.14, r*.26, -.4, 0, TAU); c.fill();
    face(c, r*.8, {ey:r*.28, blink:blinkOf(e,t), lx, ly, mouth:'o'});
  } else if (e.type==='sine'){
    c.rotate(Math.sin(t*3 + e.ph)*.25);
    const g = c.createRadialGradient(-r*.3, -r*.3, 1, 0, 0, r*1.3);
    g.addColorStop(0, '#fff6c4'); g.addColorStop(1, '#ffb800');
    c.fillStyle = fl ? '#fff' : g;
    c.lineJoin = 'round'; c.strokeStyle = fl ? '#fff' : '#ffcf3d'; c.lineWidth = r*.35;
    c.beginPath();
    for (let i=0;i<10;i++){ const rr = i%2 ? r*.62 : r*1.12; const a = i*Math.PI/5 - Math.PI/2; c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
    c.closePath(); c.stroke(); c.fill();
    face(c, r*.72, {ey:r*.08, blink:blinkOf(e,t), lx, ly});
  } else if (e.type==='chaser'){
    const g = c.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#e6d6ff'); g.addColorStop(1, '#8c5cff');
    c.fillStyle = fl ? '#fff' : g;
    c.rotate(clamp(lx*.25, -.3, .3));
    c.beginPath(); c.arc(0, -r*.1, r, Math.PI, 0);
    c.lineTo(r, r*.8);
    for (let i=0;i<4;i++){ const x0 = r - (i+.5)*r*.5, wv = Math.sin(t*12 + i + e.ph)*r*.12; c.quadraticCurveTo(x0, r*1.15 + wv, r - (i+1)*r*.5, r*.8); }
    c.closePath(); c.fill();
    face(c, r*.75, {ey:-r*.05, blink:1, lx, ly, angry:true, mouth:'grr'});
  } else if (e.type==='turret'){
    const bob = Math.sin(t*3 + e.ph)*2;
    c.translate(0, bob);
    // dome
    const dg = c.createRadialGradient(-r*.2, -r*.6, 2, 0, -r*.3, r*.9);
    dg.addColorStop(0, '#ffffff'); dg.addColorStop(1, '#a8fff0');
    c.fillStyle = fl ? '#fff' : dg;
    // ears
    c.beginPath(); c.moveTo(-r*.62, -r*.55); c.lineTo(-r*.5, -r*1.15); c.lineTo(-r*.15, -r*.8); c.fill();
    c.beginPath(); c.moveTo(r*.62, -r*.55); c.lineTo(r*.5, -r*1.15); c.lineTo(r*.15, -r*.8); c.fill();
    c.beginPath(); c.arc(0, -r*.15, r*.72, Math.PI, 0); c.fill();
    // saucer
    const sg = c.createLinearGradient(0, -r*.3, 0, r*.5);
    sg.addColorStop(0, '#7dffd9'); sg.addColorStop(1, '#14a884');
    c.fillStyle = fl ? '#fff' : sg;
    c.beginPath(); c.ellipse(0, r*.1, r*1.45, r*.45, 0, 0, TAU); c.fill();
    for (let i=0;i<5;i++){
      const on = Math.floor(t*6 + i) % 2;
      c.fillStyle = on ? ['#ff6fb5','#ffd84d','#7df9ff','#b388ff','#ff9a3c'][i] : 'rgba(255,255,255,.35)';
      c.beginPath(); c.arc((i-2)*r*.52, r*.18, r*.1, 0, TAU); c.fill();
    }
    face(c, r*.55, {ey:-r*.38, blink:blinkOf(e,t), lx, ly, mouth: e.stage===1 ? 'open' : 'smile'});
    // whiskers
    c.strokeStyle = INK; c.lineWidth = 1.2;
    for (const sd of [-1,1]){ c.beginPath(); c.moveTo(sd*r*.42, -r*.18); c.lineTo(sd*r*.72, -r*.24); c.moveTo(sd*r*.42, -r*.12); c.lineTo(sd*r*.72, -r*.08); c.stroke(); }
    if (e.hp < e.maxHp){
      c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(-r, r*.75, r*2, 4);
      c.fillStyle = '#7dffb0'; c.fillRect(-r, r*.75, r*2*Math.max(0, e.hp/e.maxHp), 4);
    }
  } else if (e.type==='boss'){
    drawBoss(c, e, t, fl, lx, ly);
  }
  c.restore();
}

function drawBoss(c, e, t, fl, lx, ly){
  const r = e.r, [c0, c1, c2] = e.pal;
  const rage = e.phase - 1;
  // tentacles
  for (let i=0;i<6;i++){
    const bx = (i-2.5)*r*.34, sd = i<3 ? -1 : 1;
    c.strokeStyle = fl ? '#fff' : c1; c.lineCap = 'round'; c.lineWidth = r*.24 - Math.abs(i-2.5)*2;
    c.beginPath(); c.moveTo(bx, r*.4);
    let px = bx, py = r*.4;
    for (let k=1;k<=5;k++){
      const ny = r*.4 + k*r*.22, nx = bx + sd*k*3 + Math.sin(t*(3+rage) + i*1.3 + k*.7)*k*3.2;
      c.quadraticCurveTo(px, (py+ny)/2, nx, ny); px = nx; py = ny;
    }
    c.stroke();
    c.fillStyle = fl ? '#fff' : c0;
    c.beginPath(); c.arc(px, py, c.lineWidth*.35, 0, TAU); c.fill();
  }
  // body
  const sq = 1 + Math.sin(t*2.4)*.035;
  c.save(); c.scale(sq, 1/sq);
  const g = c.createRadialGradient(-r*.3, -r*.5, r*.1, 0, 0, r*1.25);
  g.addColorStop(0, c0); g.addColorStop(.6, c1); g.addColorStop(1, c2);
  c.fillStyle = fl ? '#fff' : g;
  c.beginPath(); c.arc(0, 0, r, Math.PI*1.0, 0);
  c.lineTo(r, r*.35);
  for (let i=0;i<5;i++){ const x1 = r - (i+1)*r*.4; c.quadraticCurveTo(x1 + r*.2, r*.72 + Math.sin(t*5+i)*3, x1, r*.4); }
  c.closePath(); c.fill();
  // spots
  if (!fl){
    c.fillStyle = 'rgba(255,255,255,.18)';
    [[-.55,-.45,.13],[.5,-.55,.1],[.65,-.1,.08],[-.7,.05,.07]].forEach(([x,y,s])=>{ c.beginPath(); c.arc(x*r, y*r, s*r, 0, TAU); c.fill(); });
    c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-r*.35, -r*.62, r*.22, r*.1, -.5, 0, TAU); c.fill();
  }
  // big eyes
  const ex = r*.38, ey = -r*.12, er = r*.24;
  for (const sd of [-1,1]){
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(sd*ex, ey, er, er*1.12, 0, 0, TAU); c.fill();
    c.fillStyle = rage===2 ? '#d1002e' : INK;
    c.beginPath(); c.arc(sd*ex + lx*er*.38, ey + ly*er*.38, er*.55, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(sd*ex + lx*er*.38 + er*.2, ey + ly*er*.38 - er*.22, er*.2, 0, TAU); c.fill();
    if (rage){ c.strokeStyle = INK; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(sd*(ex+er*1.1), ey-er*1.5); c.lineTo(sd*(ex-er*.9), ey-er*(rage===2?.95:1.2)); c.stroke(); }
  }
  c.fillStyle = 'rgba(255,110,170,.6)';
  c.beginPath(); c.ellipse(-r*.68, r*.2, r*.13, r*.07, 0, 0, TAU); c.ellipse(r*.68, r*.2, r*.13, r*.07, 0, 0, TAU); c.fill();
  // mouth
  c.strokeStyle = INK; c.fillStyle = '#7a0f2e'; c.lineWidth = 3;
  if (rage===0){ c.beginPath(); c.arc(0, r*.18, r*.14, .15*Math.PI, .85*Math.PI); c.stroke(); }
  else if (rage===1){ c.beginPath(); c.moveTo(-r*.2, r*.28); for (let i=1;i<=4;i++) c.lineTo(-r*.2 + i*r*.1, r*.28 + (i%2?-5:0)); c.stroke(); }
  else { const o = .6 + Math.sin(t*14)*.3; c.beginPath(); c.ellipse(0, r*.3, r*.18, r*.12*o + 3, 0, 0, TAU); c.fill(); c.stroke(); }
  c.restore();
  // crown
  c.save(); c.translate(0, -r*.95); c.rotate(Math.sin(t*1.7)*.08);
  c.fillStyle = fl ? '#fff' : '#ffd84d'; c.strokeStyle = '#c98a00'; c.lineWidth = 2; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-r*.38, 0); c.lineTo(-r*.42, -r*.34); c.lineTo(-r*.2, -r*.14); c.lineTo(0, -r*.42); c.lineTo(r*.2, -r*.14); c.lineTo(r*.42, -r*.34); c.lineTo(r*.38, 0); c.closePath(); c.fill(); c.stroke();
  ['#ff4d6d','#7df9ff','#ff4d6d'].forEach((col,i)=>{ c.fillStyle = col; c.beginPath(); c.arc((i-1)*r*.22, -r*.08, r*.05, 0, TAU); c.fill(); });
  c.restore();
}

function drawShip(c, x, y, t, tilt, focus){
  c.save(); c.translate(x, y); c.rotate(tilt*.18);
  const sx = 1 - Math.abs(tilt)*.18; c.scale(sx, 1);
  // engine flames
  c.globalCompositeOperation = 'lighter';
  for (const sd of [-1,1]){
    const len = 16 + Math.random()*10 + (focus ? -4 : 0);
    const fg = c.createLinearGradient(0, 14, 0, 14+len);
    fg.addColorStop(0, 'rgba(255,255,255,.95)'); fg.addColorStop(.35, 'rgba(125,249,255,.8)'); fg.addColorStop(1, 'rgba(176,92,255,0)');
    c.fillStyle = fg;
    c.beginPath(); c.moveTo(sd*8-4.5, 13); c.quadraticCurveTo(sd*8, 14+len*1.15, sd*8+4.5, 13); c.fill();
  }
  c.globalAlpha = .6; c.drawImage(softSprite('#7df9ff'), -38, -38, 76, 76); c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';
  // wings
  const wg = c.createLinearGradient(-24, 0, 24, 0);
  wg.addColorStop(0, '#ff5ca8'); wg.addColorStop(.5, '#ff9ad0'); wg.addColorStop(1, '#ff5ca8');
  c.fillStyle = wg;
  c.beginPath(); c.moveTo(-6, -4); c.quadraticCurveTo(-24, 2, -23, 14); c.quadraticCurveTo(-14, 12, -6, 12); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(6, -4); c.quadraticCurveTo(24, 2, 23, 14); c.quadraticCurveTo(14, 12, 6, 12); c.closePath(); c.fill();
  c.fillStyle = '#ffd84d'; star(c, -19, 9, 3.4, t*2); star(c, 19, 9, 3.4, -t*2);
  // body
  const bg = c.createLinearGradient(-12, 0, 12, 0);
  bg.addColorStop(0, '#b9d4ff'); bg.addColorStop(.45, '#ffffff'); bg.addColorStop(1, '#a6c4ff');
  c.fillStyle = bg;
  c.beginPath(); c.moveTo(0, -26);
  c.bezierCurveTo(11, -20, 13, 4, 10, 15); c.quadraticCurveTo(0, 19, -10, 15);
  c.bezierCurveTo(-13, 4, -11, -20, 0, -26); c.fill();
  c.strokeStyle = 'rgba(80,60,160,.35)'; c.lineWidth = 1.5; c.stroke();
  // nose star
  c.fillStyle = '#ffd84d'; star(c, 0, -19, 4, 0);
  // cockpit with face
  c.fillStyle = '#2a1a5e'; c.beginPath(); c.ellipse(0, -8, 7.5, 6.5, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(125,249,255,.35)'; c.beginPath(); c.ellipse(-2.5, -10.5, 3, 1.6, -.4, 0, TAU); c.fill();
  const bl = (t % 3.1) < .12 ? .2 : 1;
  c.fillStyle = '#ffffff';
  c.beginPath(); c.ellipse(-2.8, -8, 1.4, 1.8*bl, 0, 0, TAU); c.ellipse(2.8, -8, 1.4, 1.8*bl, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,130,180,.8)'; c.beginPath(); c.ellipse(-5, -5.2, 1.6, 1, 0, 0, TAU); c.ellipse(5, -5.2, 1.6, 1, 0, 0, TAU); c.fill();
  c.restore();
  // hitbox core (always visible, at true position)
  c.save(); c.translate(x, y);
  const pulse = 1 + Math.sin(t*10)*.15;
  c.globalCompositeOperation = 'lighter';
  const cs = (focus ? 16 : 11)*pulse;
  c.drawImage(glowSprite('#ff4f9a'), -cs, -cs, cs*2, cs*2);
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#ffffff'; c.beginPath(); c.arc(0, 0, 2.6, 0, TAU); c.fill();
  c.strokeStyle = '#ff4f9a'; c.lineWidth = 1.4; c.beginPath(); c.arc(0, 0, 4.2, 0, TAU); c.stroke();
  if (focus){ c.strokeStyle = 'rgba(255,255,255,.5)'; c.setLineDash([3,4]); c.lineDashOffset = -t*20; c.beginPath(); c.arc(0, 0, 18, 0, TAU); c.stroke(); c.setLineDash([]); }
  c.restore();
}

function drawItem(c, it, t){
  const col = it.type==='P' ? '#ff9a3c' : it.type==='B' ? '#5b8cff' : '#ff4f86';
  const bob = Math.sin(t*5 + it.t)*2;
  c.save(); c.translate(it.x, it.y + bob);
  c.globalCompositeOperation = 'lighter'; c.globalAlpha = .8 + Math.sin(t*8)*.2;
  c.drawImage(softSprite(col), -30, -30, 60, 60);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  if (it.type==='H'){
    c.rotate(Math.sin(t*3 + it.t)*.15);
    const s = 1 + Math.sin(t*8)*.08; c.scale(s, s);
    c.fillStyle = col; c.strokeStyle = '#fff'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(0, 10); c.bezierCurveTo(-16, -1, -9, -15, 0, -6); c.bezierCurveTo(9, -15, 16, -1, 0, 10); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-5, -5, 2.5, 1.6, -.6, 0, TAU); c.fill();
  } else {
    c.rotate(Math.sin(t*2 + it.t)*.2);
    const g = c.createRadialGradient(-4, -4, 1, 0, 0, 13);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.35, col); g.addColorStop(1, col);
    c.fillStyle = g; roundRect(c, -11, -11, 22, 22, 7); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.stroke();
    c.fillStyle = '#fff'; c.font = '17px Jua'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(it.type, 0, 1.5);
  }
  c.restore();
}

// ---------- render ----------
function render(){
  const t = now/1000;
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

  // nebulae
  ctx.globalCompositeOperation = 'lighter';
  for (const n of nebulae){
    ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(n.rot); ctx.globalAlpha = .9;
    const s = 320*n.s; ctx.drawImage(nebulaSprites[n.i], -s/2, -s/2, s, s); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // stars
  for (const L of starLayers){
    for (const s of L.stars){
      ctx.globalAlpha = L.a * (.6 + .4*Math.sin(t*3 + s.tw));
      ctx.fillStyle = s.hue;
      if (L.streak){ const len = 6 + 10*starBoost; ctx.fillRect(s.x, s.y - len, 1.6, len); }
      else ctx.fillRect(s.x, s.y, L.size, L.size);
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  if (state !== 'title'){
    for (const it of items) drawItem(ctx, it, t);
    for (const e of enemies) if (e.type !== 'boss') drawEnemy(ctx, e, t);
    if (boss) drawEnemy(ctx, boss, t);

    // player bullets
    ctx.globalCompositeOperation = 'lighter';
    const ps = glowSprite('#7df9ff');
    for (const b of pBullets){
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a + Math.PI/2);
      ctx.drawImage(ps, -7, -17, 14, 34); ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';

    if (player.alive && !(player.inv > 0 && Math.floor(t*16)%2===0)) drawShip(ctx, player.x, player.y, t, player.tilt, player.focus);
    else if (player.alive){ ctx.globalAlpha = .3; drawShip(ctx, player.x, player.y, t, player.tilt, player.focus); ctx.globalAlpha = 1; }
  } else {
    drawShip(ctx, W/2, H*.72 + Math.sin(t*2)*8, t, Math.sin(t*1.2)*.4, false);
  }

  // particles (additive)
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles){
    if (p.type !== 'spark') continue;
    const a = Math.min(1, p.life/p.max*1.5), s = p.size*(.4 + a*.8)*2;
    ctx.globalAlpha = a; ctx.drawImage(glowSprite(p.color), p.x - s, p.y - s, s*2, s*2);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  for (const p of particles){
    if (p.type === 'spark') continue;
    const a = Math.min(1, p.life/p.max*1.6);
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    if (p.type === 'star') star(ctx, p.x, p.y, p.size*(.5 + a*.5), p.rot);
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*.6); ctx.restore(); }
  }
  ctx.globalAlpha = 1;

  // rings
  ctx.globalCompositeOperation = 'lighter';
  for (const g of rings){
    const k = 1 - g.life/g.max, e = easeOutCubic(k);
    ctx.strokeStyle = g.color; ctx.globalAlpha = 1 - k; ctx.lineWidth = g.w*(1-k) + 1;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r + (g.to - g.r)*e, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // enemy bullets
  for (const b of eBullets){
    const s = b.r*2;
    ctx.drawImage(glowSprite(b.color), b.x - s, b.y - s, s*2, s*2);
  }

  // bomb waves
  for (const w of bombWaves){
    const k = w.r/900;
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#ffe36e'; ctx.lineWidth = 26*(1-k) + 4;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8*(1-k) + 2;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r*.9, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#ff9ad0'; ctx.lineWidth = 6*(1-k) + 1;
    ctx.beginPath(); ctx.arc(w.x, w.y, Math.max(0, w.r*.75), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // floating texts
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const tx of texts){
    const k = 1 - tx.life/tx.max, sc = k < .2 ? easeOutBack(k/.2) : 1;
    ctx.save(); ctx.translate(tx.x, tx.y); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, tx.life*2.5);
    ctx.font = `${tx.size}px Jua`; ctx.lineWidth = 5; ctx.strokeStyle = '#1a0b3d';
    ctx.strokeText(tx.text, 0, 0); ctx.fillStyle = tx.color; ctx.fillText(tx.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state !== 'title') drawHudCanvas(t);

  // flash
  if (flash > 0){ ctx.fillStyle = `rgba(${flashColor},${Math.min(1, flash)*.75})`; ctx.fillRect(0, 0, W, H); }
  if (warning) drawWarning(t);
  if (banner) drawBanner(t);
  if (bigPop) drawBigPop(t);
}

function drawHudCanvas(t){
  ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  // wave + power
  ctx.font = '15px Jua'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(`WAVE ${waveN}`, 12, H-38);
  ctx.fillText('POWER', 12, H-18);
  for (let i=0;i<5;i++){
    const on = i < player.power;
    ctx.fillStyle = on ? (player.power===5 ? `hsl(${(t*200+i*40)%360},95%,65%)` : '#ffb14d') : 'rgba(255,255,255,.18)';
    roundRect(ctx, 66 + i*14, H-24, 10, 12, 3); ctx.fill();
  }
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.fillText(`GRAZE ${graze}`, W-12, H-18);
  if (player.focus){ ctx.fillStyle = 'rgba(255,170,220,.85)'; ctx.fillText('정밀 이동', W-12, H-38); }

  // boss bar
  if (boss){
    const k = Math.max(0, boss.hp/boss.maxHp), bw = W - 40;
    const appear = boss.entering ? Math.min(1, boss.enterT/1.2) : 1;
    ctx.save(); ctx.globalAlpha = appear;
    ctx.fillStyle = 'rgba(10,5,30,.6)'; roundRect(ctx, 14, 10, W-28, 36, 12); ctx.fill();
    ctx.font = '14px Jua'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
    ctx.fillText(`👑 ${boss.name}`, 24, 21);
    ctx.textAlign = 'right'; ctx.fillStyle = boss.phase===3 ? '#ff4d6d' : boss.phase===2 ? '#ffd84d' : '#c88cff';
    ctx.fillText(`PHASE ${boss.phase}`, W-24, 21);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; roundRect(ctx, 20, 31, bw, 9, 4.5); ctx.fill();
    const g = ctx.createLinearGradient(20, 0, 20+bw, 0);
    g.addColorStop(0, '#ff4d6d'); g.addColorStop(.5, '#ff9ad0'); g.addColorStop(1, '#c88cff');
    ctx.fillStyle = boss.flash > 0 ? '#fff' : g;
    if (k > 0){ roundRect(ctx, 20, 31, Math.max(9, bw*(boss.entering ? Math.min(1, boss.enterT/2.4) : k)), 9, 4.5); ctx.fill(); }
    ctx.fillStyle = 'rgba(10,5,30,.8)';
    ctx.fillRect(20 + bw*.33, 31, 2, 9); ctx.fillRect(20 + bw*.66, 31, 2, 9);
    ctx.restore();
  }
}

function drawWarning(t){
  const k = warning.t, a = Math.min(1, k*4) * Math.min(1, (2.9 - k)*3);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  // red vignette
  const v = ctx.createRadialGradient(W/2, H/2, H*.25, W/2, H/2, H*.75);
  v.addColorStop(0, 'rgba(255,0,60,0)'); v.addColorStop(1, `rgba(255,0,60,${.3 + .2*Math.sin(t*12)})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const cy = H*.4, bh = 120;
  ctx.fillStyle = `rgba(80,0,20,${.65})`; ctx.fillRect(0, cy - bh/2, W, bh);
  // striped bands
  for (const by of [cy - bh/2 - 14, cy + bh/2]){
    ctx.save(); ctx.beginPath(); ctx.rect(0, by, W, 14); ctx.clip();
    ctx.fillStyle = '#ff2d55'; ctx.fillRect(0, by, W, 14);
    ctx.fillStyle = '#1a0010';
    const off = (t*90) % 28;
    for (let x = -28; x < W + 28; x += 28){ ctx.beginPath(); ctx.moveTo(x + off, by); ctx.lineTo(x + off + 14, by); ctx.lineTo(x + off + 0, by + 14); ctx.lineTo(x + off - 14, by + 14); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  const s = 1 + .08*Math.sin(t*16);
  ctx.translate(W/2, cy - 10); ctx.scale(s, s);
  ctx.font = '58px Jua'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.strokeText('WARNING', 0, 0);
  ctx.fillStyle = Math.floor(t*8)%2 ? '#ff2d55' : '#ff7a90'; ctx.fillText('WARNING', 0, 0);
  ctx.font = '20px Jua'; ctx.fillStyle = '#ffe0e8'; ctx.fillText('거대 보스 접근 중!', 0, 42);
  ctx.restore();
}

function drawBanner(t){
  const k = banner.t/2;
  const slide = k < .15 ? 1 - easeOutBack(k/.15) : k > .85 ? -(k-.85)/.15 : 0;
  ctx.save(); ctx.translate(W/2 + slide*W, H*.3);
  ctx.fillStyle = 'rgba(15,8,45,.78)'; roundRect(ctx, -140, -36, 280, 72, 26); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = banner.color; ctx.shadowColor = banner.color; ctx.shadowBlur = 16; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '32px Jua'; ctx.fillStyle = banner.color; ctx.fillText(banner.text, 0, -8);
  ctx.font = '15px Jua'; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillText(banner.sub, 0, 20);
  ctx.restore();
}

function drawBigPop(t){
  const k = bigPop.t;
  const sc = k < .35 ? easeOutBack(k/.35)*1.15 : 1.15 - Math.min(.15, (k-.35)*.2);
  ctx.save(); ctx.translate(W/2, H*.38); ctx.rotate(Math.sin(k*18)*.04*Math.max(0, 1-k)); ctx.scale(sc, sc);
  ctx.globalAlpha = k > 1.9 ? Math.max(0, (2.4-k)/.5) : 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = '50px Jua';
  const g = ctx.createLinearGradient(-120, 0, 120, 0);
  g.addColorStop(0, '#ff5ca8'); g.addColorStop(.5, '#ffe36e'); g.addColorStop(1, '#7df9ff');
  ctx.lineWidth = 10; ctx.strokeStyle = '#1a0b3d'; ctx.strokeText(bigPop.text, 0, 0);
  ctx.fillStyle = g; ctx.fillText(bigPop.text, 0, 0);
  ctx.font = '24px Jua'; ctx.lineWidth = 6; ctx.strokeText(bigPop.sub, 0, 44); ctx.fillStyle = '#fff'; ctx.fillText(bigPop.sub, 0, 44);
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function frame(ts){
  const dt = Math.min(.05, Math.max(0, (ts - last)/1000)); last = ts; now = ts;
  update(dt); render();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
