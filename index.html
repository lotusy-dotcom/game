<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>팡팡 게임랜드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Jua',system-ui,sans-serif;color:#4a2c2a;overflow-x:hidden;
    background:linear-gradient(135deg,#ffd6e8,#ffe9c7,#d4f5e9,#d6e4ff,#ffd6e8);
    background-size:400% 400%;animation:bgmove 18s ease infinite;min-height:100vh;
  }
  @keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bubble{position:absolute;bottom:-160px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 60%,transparent 70%);
    animation:rise linear infinite;opacity:.7}
  @keyframes rise{0%{transform:translateY(0) translateX(0) scale(.8)}50%{transform:translateY(-60vh) translateX(40px) scale(1)}100%{transform:translateY(-125vh) translateX(-30px) scale(1.1)}}

  main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:36px 16px 48px}
  header{text-align:center;margin-bottom:30px}
  h1{font-size:clamp(40px,9vw,72px);font-weight:400;line-height:1.05;text-shadow:0 4px 0 #fff,0 0 20px rgba(255,255,255,.9)}
  h1 span{display:inline-block;animation:wave 1.8s ease-in-out infinite, popin .7s cubic-bezier(.2,1.7,.4,1) backwards}
  @keyframes wave{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(-4deg)}}
  @keyframes popin{from{transform:scale(0) rotate(-40deg);opacity:0}}
  header p{margin-top:10px;font-size:18px;opacity:.7;animation:fadeup .8s .6s backwards}
  @keyframes fadeup{from{opacity:0;transform:translateY(16px)}}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;perspective:1000px}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .card{position:relative;border-radius:28px;padding:12px;cursor:pointer;text-decoration:none;color:inherit;display:block;
    background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:3px solid rgba(255,255,255,.9);box-shadow:0 16px 40px rgba(150,70,110,.2);
    transform-style:preserve-3d;transition:transform .25s ease, box-shadow .25s;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    animation:cardin .8s cubic-bezier(.2,1.5,.4,1) backwards;overflow:hidden}
  .card:hover{box-shadow:0 24px 60px rgba(150,70,110,.32)}
  @keyframes cardin{from{opacity:0;transform:translateY(60px) scale(.8) rotate(-4deg)}}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),transparent 45%);
    opacity:0;transition:opacity .25s}
  .card:hover::after{opacity:1}
  .card .shine{position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg)}
  .card:hover .shine{animation:sweep .9s ease}
  @keyframes sweep{to{left:130%}}
  .card canvas{display:block;width:100%;aspect-ratio:16/10;border-radius:18px;transform:translateZ(30px)}
  .info{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 6px 4px;transform:translateZ(40px)}
  .info h2{font-size:clamp(20px,5vw,26px);font-weight:400;white-space:nowrap}
  .info>div:first-child{min-width:0}
  .info p{font-size:14px;opacity:.65}
  .tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;color:#fff;margin-bottom:4px}
  .best{text-align:right;min-width:72px}
  .best small{display:block;font-size:11px;opacity:.6;letter-spacing:1px}
  .best b{font-weight:400;font-size:22px}
  .play{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;
    color:#fff;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .2s}
  .card:hover .play{transform:scale(1.15) rotate(-10deg);animation:pulse 1s ease infinite}
  @keyframes pulse{50%{box-shadow:0 5px 0 rgba(0,0,0,.15),0 0 0 10px rgba(255,255,255,.4)}}
  .right{display:flex;align-items:center;gap:12px}

  #wipe{position:fixed;z-index:50;border-radius:50%;pointer-events:none;width:20px;height:20px;transform:translate(-50%,-50%) scale(0)}
  #wipe.go{transition:transform .6s cubic-bezier(.7,0,.3,1);transform:translate(-50%,-50%) scale(220)}
  .card.chosen{animation:chosen .6s ease forwards}
  @keyframes chosen{30%{transform:scale(.94)}100%{transform:scale(1.08)}}
  footer{text-align:center;margin-top:30px;opacity:.55;font-size:14px}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<main>
  <header>
    <h1 id="title"></h1>
    <p>골라서 바로 플레이! 4가지 미니게임</p>
  </header>
  <div class="grid" id="grid"></div>
  <footer>마우스 · 터치 · 키보드 모두 지원</footer>
</main>
<div id="wipe"></div>

<script>
(() => {
const TAU = Math.PI*2;
const GAMES = [
  {id:'fruit', href:'fruit-merge.html', name:'과일 팡팡', desc:'같은 과일을 합쳐 더 큰 과일로!', tag:'퍼즐 · 물리', color:'#ff5c8a', key:'fruitpang_best'},
  {id:'brick', href:'brick-breaker.html', name:'벽돌 팡팡', desc:'공을 튕겨 벽돌을 와장창!', tag:'아케이드', color:'#ff9a3c', key:'brick_best'},
  {id:'runner', href:'jump-runner.html', name:'점프 팡팡', desc:'점프! 슬라이드! 끝없이 달려라', tag:'러너', color:'#3fbf7f', key:'runner_best'},
  {id:'shooter', href:'bullet-shooter.html', name:'별빛 팡팡', desc:'쏟아지는 탄막을 피해 우주로', tag:'슈팅', color:'#7c5cff', key:'shooter_best'},
];

// title
const t = '팡팡 게임랜드', cols = ['#ff5c8a','#ffa62b','#4cc38a','#5b8cff','#b05cff','#ff5c8a','#ffa62b'];
document.getElementById('title').innerHTML = [...t].map((c,i)=>c===' '?'&nbsp;':
  `<span style="color:${cols[i%cols.length]};animation-delay:${i*.12}s,${i*.06}s">${c}</span>`).join('');

// bubbles
const bw = document.getElementById('bubbles');
for (let i=0;i<16;i++){ const b=document.createElement('div'); b.className='bubble'; const s=20+Math.random()*90;
  Object.assign(b.style,{width:s+'px',height:s+'px',left:Math.random()*100+'%',animationDuration:(10+Math.random()*14)+'s',animationDelay:(-Math.random()*20)+'s'}); bw.appendChild(b); }

// cards
const grid = document.getElementById('grid');
const demos = [];
function buildCards(){ GAMES.forEach((g,i)=>{
  let best = 0; try { best = +localStorage.getItem(g.key) || 0; } catch(e){}
  const a = document.createElement('a');
  a.className='card'; a.href=g.href; a.style.animationDelay = (.3+i*.12)+'s';
  a.innerHTML = `<div class="shine"></div><canvas></canvas>
    <div class="info"><div><span class="tag" style="background:${g.color}">${g.tag}</span><h2>${g.name}</h2><p>${g.desc}</p></div>
    <div class="right"><div class="best"><small>BEST</small><b>${best}</b></div><span class="play" style="background:${g.color}">▶</span></div></div>`;
  grid.appendChild(a);
  const cv = a.querySelector('canvas');
  demos.push({cv, ctx:cv.getContext('2d'), draw:DEMOS[g.id](), card:a});
  a.addEventListener('pointermove', e=>{
    const r=a.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    a.style.setProperty('--ry', ((x-.5)*14)+'deg'); a.style.setProperty('--rx', ((.5-y)*12)+'deg');
    a.style.setProperty('--mx', x*100+'%'); a.style.setProperty('--my', y*100+'%');
  });
  a.addEventListener('pointerleave', ()=>{ a.style.setProperty('--ry','0deg'); a.style.setProperty('--rx','0deg'); });
  a.addEventListener('click', e=>{
    e.preventDefault();
    a.classList.add('chosen');
    const w = document.getElementById('wipe');
    w.style.left = e.clientX+'px'; w.style.top = e.clientY+'px'; w.style.background = g.color;
    requestAnimationFrame(()=>w.classList.add('go'));
    setTimeout(()=>{ location.href = g.href; }, 620);
  });
}); }
window.addEventListener('pageshow', e=>{ if (e.persisted){ document.getElementById('wipe').classList.remove('go'); document.querySelectorAll('.card').forEach(c=>c.classList.remove('chosen')); } });

// ---------- mini demos (each draws into 320x200 logical) ----------
function DEMOS_face(c, r, ink='#3a1d1d'){
  c.fillStyle=ink; c.beginPath(); c.arc(-r*.3,0,r*.1,0,TAU); c.arc(r*.3,0,r*.1,0,TAU); c.fill();
  c.strokeStyle=ink; c.lineWidth=Math.max(1,r*.06); c.beginPath(); c.arc(0,r*.18,r*.1,.15*Math.PI,.85*Math.PI); c.stroke();
  c.fillStyle='rgba(255,100,140,.45)'; c.beginPath(); c.ellipse(-r*.5,r*.22,r*.13,r*.07,0,0,TAU); c.ellipse(r*.5,r*.22,r*.13,r*.07,0,0,TAU); c.fill();
}
function ball(c,x,y,r,c0,c1){
  const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r); g.addColorStop(0,c0); g.addColorStop(1,c1);
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
  c.fillStyle='rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(x-r*.35,y-r*.4,r*.25,r*.13,-.6,0,TAU); c.fill();
}
var DEMOS = {
  fruit(){
    const F=[['#ffb3c1','#ff4d6d',10],['#e0c3ff','#9d4edd',14],['#ffe0a3','#ffa62b',18],['#ffa3a3','#f03a47',23],['#b8f5b0','#4cbb5a',30]];
    const items=[]; let spawnT=0; const burst=[];
    return (c,t,dt)=>{
      const bg=c.createLinearGradient(0,0,0,200); bg.addColorStop(0,'#fff8fb'); bg.addColorStop(1,'#ffe6d5'); c.fillStyle=bg; c.fillRect(0,0,320,200);
      spawnT-=dt; if(spawnT<=0 && items.length<9){ spawnT=.7; const l=Math.floor(Math.random()*3); items.push({x:60+Math.random()*200,y:-20,vy:0,vx:0,l,s:1,sq:0}); }
      for(const a of items){ a.vy+=500*dt; a.x+=a.vx*dt; a.y+=a.vy*dt; const r=F[a.l][2];
        if(a.y>190-r){ if(a.vy>120) a.sq=.25; a.y=190-r; a.vy*=-.3; a.vx*=.9; }
        if(a.x<r){a.x=r;a.vx*=-.5} if(a.x>320-r){a.x=320-r;a.vx*=-.5} a.sq*=Math.pow(.02,dt); }
      for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++){ const a=items[i],b=items[j], ra=F[a.l][2], rb=F[b.l][2];
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
        if(d<ra+rb){ if(a.l===b.l && a.l<4){ a.l++; a.x=(a.x+b.x)/2; a.y=(a.y+b.y)/2; a.s=.4; items.splice(j,1); j--; burst.push({x:a.x,y:a.y,t:0,c:F[a.l][1]}); continue; }
          const o=(ra+rb-d)/2; a.x-=dx/d*o; a.y-=dy/d*o; b.x+=dx/d*o; b.y+=dy/d*o; a.vx-=dx/d*20; b.vx+=dx/d*20; } }
      if(items.length>=9 && Math.random()<dt*.3) items.splice(0,4);
      for(const p of burst){ p.t+=dt; c.strokeStyle=p.c; c.globalAlpha=Math.max(0,1-p.t*2.5); c.lineWidth=4; c.beginPath(); c.arc(p.x,p.y,10+p.t*120,0,TAU); c.stroke(); } c.globalAlpha=1;
      for(let k=burst.length-1;k>=0;k--) if(burst[k].t>.4) burst.splice(k,1);
      for(const a of items){ a.s+=(1-a.s)*Math.min(1,dt*10); const r=F[a.l][2]*a.s; c.save(); c.translate(a.x,a.y); c.scale(1+a.sq,1-a.sq); ball(c,0,0,r,F[a.l][0],F[a.l][1]); DEMOS_face(c,r); c.restore(); }
    };
  },
  brick(){
    const cols=['#ff5c8a','#ffa62b','#ffd23f','#4cc38a','#5b8cff'];
    let bricks=[], b={x:160,y:150,vx:140,vy:-160}, pad=160, trail=[], parts=[], padSq=0;
    const build=()=>{ bricks=[]; for(let r=0;r<5;r++) for(let c=0;c<8;c++) bricks.push({x:14+c*37,y:16+r*16,a:1,drop:-(r*8+c)*.04}); };
    build();
    return (c,t,dt)=>{
      c.fillStyle='#2b2250'; c.fillRect(0,0,320,200);
      const g=c.createRadialGradient(160,40,10,160,40,240); g.addColorStop(0,'rgba(255,120,200,.25)'); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,320,200);
      for(let s=0;s<3;s++){ b.x+=b.vx*dt/3; b.y+=b.vy*dt/3;
        if(b.x<5||b.x>315){b.vx*=-1;b.x=Math.max(5,Math.min(315,b.x));} if(b.y<5){b.vy*=-1;b.y=5;}
        if(b.y>178 && b.vy>0 && Math.abs(b.x-pad)<34){ b.vy*=-1; b.vx=(b.x-pad)*5; padSq=.4; }
        if(b.y>205){ b.x=pad; b.y=170; b.vy=-160; }
        for(const k of bricks){ if(k.a>0 && k.drop>=1 && b.x>k.x-4&&b.x<k.x+38&&b.y>k.y-4&&b.y<k.y+18){ k.a=0; b.vy*=-1;
          for(let i=0;i<10;i++) parts.push({x:k.x+17,y:k.y+7,vx:(Math.random()-.5)*200,vy:(Math.random()-.8)*150,l:.6,c:cols[Math.floor((k.y-16)/16)]}); break; } } }
      pad+=(b.x-pad)*Math.min(1,dt*6); padSq*=Math.pow(.01,dt);
      if(bricks.every(k=>k.a===0)) build();
      for(const k of bricks){ k.drop=Math.min(1,k.drop+dt*2.5); if(k.a<=0||k.drop<0) continue;
        const e=k.drop<1? 1+Math.pow(2,-10*k.drop)*Math.sin((k.drop*10-.75)*TAU/3) : 1;
        const y=k.y-(1-Math.min(1,e))*60; c.fillStyle=cols[Math.floor((k.y-16)/16)];
        c.beginPath(); c.roundRect? c.roundRect(k.x,y,34,13,4):c.rect(k.x,y,34,13); c.fill(); c.fillStyle='rgba(255,255,255,.35)'; c.fillRect(k.x+3,y+2,28,3); }
      trail.push({x:b.x,y:b.y}); if(trail.length>10) trail.shift();
      c.globalCompositeOperation='lighter'; trail.forEach((p,i)=>{ c.fillStyle=`rgba(255,200,120,${i/30})`; c.beginPath(); c.arc(p.x,p.y,5*i/10+1,0,TAU); c.fill(); });
      c.globalCompositeOperation='source-over';
      ball(c,b.x,b.y,5,'#fff','#ffcc66');
      for(const p of parts){ p.l-=dt; p.vy+=400*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; c.globalAlpha=Math.max(0,p.l/.6); c.fillStyle=p.c; c.fillRect(p.x-2,p.y-2,4,4); } c.globalAlpha=1;
      parts=parts.filter(p=>p.l>0);
      c.save(); c.translate(pad,186); c.scale(1+padSq*.3,1-padSq*.5); c.fillStyle='#ff8fb8'; c.beginPath(); c.roundRect? c.roundRect(-32,-6,64,12,6):c.rect(-32,-6,64,12); c.fill();
      c.fillStyle='#fff'; c.fillRect(-26,-4,52,3); c.restore();
    };
  },
  runner(){
    let x=0, y=0, vy=0, obs=[{x:340,t:0}], dust=[], speed=150, sq=0;
    return (c,t,dt)=>{
      const sky=c.createLinearGradient(0,0,0,200); const k=(Math.sin(t*.25)+1)/2;
      sky.addColorStop(0, k>.5?'#7ec8ff':'#ff9a8b'); sky.addColorStop(1, k>.5?'#d6f0ff':'#ffd29b'); c.fillStyle=sky; c.fillRect(0,0,320,200);
      c.fillStyle='rgba(255,240,180,.9)'; c.beginPath(); c.arc(260,40,18,0,TAU); c.fill();
      x+=speed*dt;
      c.fillStyle='rgba(255,255,255,.85)'; for(let i=0;i<4;i++){ const cx=((i*110-x*.15)%440+440)%440-60; c.beginPath(); c.arc(cx,40+i%2*18,14,0,TAU); c.arc(cx+16,36+i%2*18,18,0,TAU); c.arc(cx+34,42+i%2*18,12,0,TAU); c.fill(); }
      c.fillStyle='#9ad3a8'; c.beginPath(); c.moveTo(0,160); for(let i=0;i<=320;i+=10) c.lineTo(i,140-Math.sin((i+x*.3)/40)*18-Math.sin((i+x*.3)/17)*6); c.lineTo(320,200); c.lineTo(0,200); c.fill();
      c.fillStyle='#6dbb5f'; c.fillRect(0,165,320,35); c.fillStyle='#8b5a3c'; c.fillRect(0,172,320,28);
      c.fillStyle='#5aa64e'; for(let i=-1;i<17;i++){ const gx=i*20-(x%20); c.fillRect(gx,165,10,7); }
      for(const o of obs){ o.x-=speed*dt; }
      if(obs[obs.length-1].x<160+Math.random()*200) obs.push({x:340+Math.random()*60,t:Math.random()<.5?0:1});
      obs=obs.filter(o=>o.x>-30);
      const px=70, gy=165;
      const nxt=obs.find(o=>o.x>px-10);
      if(y===0 && nxt && nxt.x-px<60 && nxt.x-px>20){ vy=-330; sq=-.3; for(let i=0;i<5;i++) dust.push({x:px,y:gy,vx:-Math.random()*60,vy:-Math.random()*40,l:.4}); }
      vy+=900*dt; y=Math.min(0,y+vy*dt); if(y===0 && vy>0){ if(vy>200){ sq=.3; for(let i=0;i<6;i++) dust.push({x:px+(Math.random()-.5)*20,y:gy,vx:(Math.random()-.5)*80,vy:-Math.random()*40,l:.4}); } vy=0; }
      sq*=Math.pow(.01,dt);
      for(const o of obs){ if(o.t===0){ c.fillStyle='#8a8fa3'; c.beginPath(); for(let s=0;s<3;s++){ c.moveTo(o.x+s*10,gy); c.lineTo(o.x+s*10+5,gy-16); c.lineTo(o.x+s*10+10,gy);} c.fill(); }
        else { c.fillStyle='#c98a4b'; c.fillRect(o.x,gy-22,22,22); c.strokeStyle='#8b5a2b'; c.lineWidth=2; c.strokeRect(o.x+1,gy-21,20,20); c.beginPath(); c.moveTo(o.x+2,gy-20); c.lineTo(o.x+20,gy-2); c.stroke(); } }
      for(const d of dust){ d.l-=dt; d.x+=d.vx*dt-speed*dt*.5; d.y+=d.vy*dt; c.fillStyle=`rgba(255,255,255,${d.l*2})`; c.beginPath(); c.arc(d.x,d.y,4*(1-d.l)+2,0,TAU); c.fill(); }
      dust=dust.filter(d=>d.l>0);
      c.save(); c.translate(px, gy+y-14); c.scale(1+sq*.6,1-sq*.6);
      const leg=Math.sin(t*20)*(y===0?5:2); c.strokeStyle='#d94f7a'; c.lineWidth=4; c.lineCap='round';
      c.beginPath(); c.moveTo(-5,10); c.lineTo(-5+leg,15); c.moveTo(5,10); c.lineTo(5-leg,15); c.stroke();
      ball(c,0,0,14,'#ffc4d6','#ff6b9d'); DEMOS_face(c,14); c.restore();
    };
  },
  shooter(){
    const stars=Array.from({length:60},()=>({x:Math.random()*320,y:Math.random()*200,z:Math.random()*3+.5}));
    let bullets=[], ebul=[], enemies=[], parts=[], fireT=0, spawnT=0;
    return (c,t,dt)=>{
      c.fillStyle='#120b2e'; c.fillRect(0,0,320,200);
      const n=c.createRadialGradient(80,60,0,80,60,140); n.addColorStop(0,'rgba(150,80,255,.25)'); n.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=n; c.fillRect(0,0,320,200);
      for(const s of stars){ s.y+=s.z*40*dt; if(s.y>200){s.y=0;s.x=Math.random()*320;} c.fillStyle=`rgba(255,255,255,${s.z/3.5})`; c.fillRect(s.x,s.y,s.z*.8,s.z*.8); }
      const sx=160+Math.sin(t*1.3)*110, sy=170+Math.sin(t*2.1)*8;
      fireT-=dt; if(fireT<=0){ fireT=.09; bullets.push({x:sx-6,y:sy-10},{x:sx+6,y:sy-10}); }
      spawnT-=dt; if(spawnT<=0){ spawnT=.9; enemies.push({x:30+Math.random()*260,y:-15,hp:4,f:0,ph:Math.random()*TAU,st:0}); }
      c.globalCompositeOperation='lighter';
      for(const b of bullets){ b.y-=380*dt; c.fillStyle='rgba(120,220,255,.9)'; c.fillRect(b.x-1.5,b.y-6,3,12); }
      for(const e of enemies){ e.y+=40*dt; e.x+=Math.sin(t*2+e.ph)*40*dt; e.f=Math.max(0,e.f-dt*6); e.st-=dt;
        if(e.st<=0 && e.y>10){ e.st=1.4; for(let i=0;i<10;i++){ const a=i/10*TAU+t; ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*70,vy:Math.sin(a)*70}); } } }
      for(const b of ebul){ b.x+=b.vx*dt; b.y+=b.vy*dt; c.fillStyle='rgba(255,90,170,.35)'; c.beginPath(); c.arc(b.x,b.y,5,0,TAU); c.fill(); c.fillStyle='#ffd0ea'; c.beginPath(); c.arc(b.x,b.y,2,0,TAU); c.fill(); }
      c.globalCompositeOperation='source-over';
      for(const b of bullets) for(const e of enemies){ if(e.hp>0 && Math.abs(b.x-e.x)<13 && Math.abs(b.y-e.y)<12){ e.hp--; e.f=1; b.y=-99;
        if(e.hp<=0){ for(let i=0;i<18;i++){ const a=Math.random()*TAU, s=40+Math.random()*120; parts.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,ring:i===0}); } } } }
      enemies=enemies.filter(e=>e.hp>0&&e.y<220); bullets=bullets.filter(b=>b.y>-10); ebul=ebul.filter(b=>b.x>-10&&b.x<330&&b.y>-10&&b.y<210).slice(-200);
      for(const e of enemies){ c.save(); c.translate(e.x,e.y); ball(c,0,0,12,e.f>0?'#fff':'#9cf5ff', e.f>0?'#fff':'#3a7bff'); DEMOS_face(c,12); c.restore(); }
      for(const p of parts){ p.l-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; c.globalAlpha=Math.max(0,p.l/.6);
        if(p.ring){ c.strokeStyle='#fff'; c.lineWidth=3; c.beginPath(); c.arc(p.x,p.y,(1-p.l/.6)*30,0,TAU); c.stroke(); }
        c.fillStyle=Math.random()<.5?'#ffd23f':'#ff7bc2'; c.fillRect(p.x-2,p.y-2,4,4); } c.globalAlpha=1; parts=parts.filter(p=>p.l>0);
      // ship
      c.save(); c.translate(sx,sy);
      c.globalCompositeOperation='lighter'; const fl=8+Math.random()*6; const fg=c.createLinearGradient(0,6,0,6+fl); fg.addColorStop(0,'rgba(255,200,80,.9)'); fg.addColorStop(1,'rgba(255,80,80,0)');
      c.fillStyle=fg; c.beginPath(); c.moveTo(-5,6); c.lineTo(0,6+fl); c.lineTo(5,6); c.fill(); c.globalCompositeOperation='source-over';
      c.fillStyle='#f4f1ff'; c.beginPath(); c.moveTo(0,-14); c.lineTo(12,8); c.lineTo(0,4); c.lineTo(-12,8); c.closePath(); c.fill();
      c.fillStyle='#ff6b9d'; c.beginPath(); c.arc(0,-2,4,0,TAU); c.fill(); c.restore();
    };
  },
};

// resize canvases + loop
function sizeAll(){ const d=Math.min(window.devicePixelRatio||1,2); for(const m of demos){ const w=m.cv.clientWidth; m.cv.width=Math.round(w*d); m.cv.height=Math.round(w*10/16*d); m.k=m.cv.width/320; } }
buildCards();
window.addEventListener('resize', sizeAll); sizeAll();
let last=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000); last=ts; const t=ts/1000;
  for(const m of demos){ m.ctx.setTransform(m.k,0,0,m.k,0,0); m.draw(m.ctx,t,dt); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
